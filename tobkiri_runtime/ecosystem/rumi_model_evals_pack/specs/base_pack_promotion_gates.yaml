spec_id: rumi.model_evals.base_pack_promotion_gates.v1
description: Advisory gates for promoting model/provider routing evidence into base Pack policy.
network_default: none
gate_decisions:
  - recommend
  - allow
  - hold
  - quarantine
  - demote
  - gather_more_evidence
required_evidence:
  - contract_eval_pass_rate
  - provider_smoke_success
  - pass_at_k_threshold
  - pass_power_k_threshold_optional
  - flakiness_below_threshold
  - cost_latency_budget_status
  - safety_regression_check
  - overlap_consumer_notes
threshold_defaults:
  contract_eval_pass_rate_min: 1.0
  provider_smoke_required: true
  flakiness_max: 0.05
  minimum_runs_for_promotion: 10
  minimum_task_families_for_general_route: 3
promotion_payload_fields:
  - target_provider
  - target_model
  - proposed_route
  - decision
  - evidence_refs
  - metric_summary
  - consumer_pack_impacts
  - caveats
  - reviewer
