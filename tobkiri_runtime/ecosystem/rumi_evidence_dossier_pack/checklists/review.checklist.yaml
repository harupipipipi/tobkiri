review_checklist:
  minimum_pass: all_blocking_items
  items:
  - id: source_provenance_present
    question: Every source has provenance and retrieval owner.
    blocking: true
  - id: claim_has_evidence
    question: Every supported claim has evidence IDs.
    blocking: true
  - id: source_anchor_present
    question: Every evidence link has an anchor.
    blocking: true
  - id: contradiction_blocks_export
    question: Unresolved contradictions block verified export.
    blocking: true
  - id: citation_ledger_complete
    question: Missing claim IDs force blocked state.
    blocking: true
  - id: no_retrieval_execution
    question: Retrieval is handed to research or connector packs.
    blocking: true
  - id: reviewer_queue_blocking
    question: Blocking issues appear in reviewer queue.
    blocking: true
  - id: quality_label_present
    question: Sources have credibility and recency labels.
    blocking: true
  - id: no_credentials_or_network
    question: Pack has no credentials, no required network, and no executable code.
    blocking: true
  - id: base_pack_promotion_false
    question: Promotion remains false until evidence is accepted.
    blocking: true
  - id: asset_index_complete
    question: Every pack file is indexed.
    blocking: true
