review_checklist:
  minimum_pass: all_blocking_items
  items:
  - id: identity_merge_evidence
    question: Identity merges require evidence IDs.
    blocking: true
  - id: acl_denies_unauthorized_tools
    question: Unauthorized channels cannot run tools.
    blocking: true
  - id: outbound_draft_until_approved
    question: Outbound delivery owner receives only approved drafts.
    blocking: true
  - id: connector_owner_named
    question: External IO is connector-owned.
    blocking: true
  - id: routing_requires_acl
    question: Routing rules require ACL state.
    blocking: true
  - id: notification_scheduler_handoff
    question: Notification windows hand off to scheduler.
    blocking: true
  - id: security_review_for_risky_acl
    question: ACL review owner is security review pack.
    blocking: true
  - id: inbox_ui_readable
    question: Inbox UI lists lanes, filters, and approval actions.
    blocking: true
  - id: no_credentials_or_network
    question: Pack has no credentials, no required network, and no executable code.
    blocking: true
  - id: base_pack_promotion_false
    question: Promotion remains false until evidence is accepted.
    blocking: true
  - id: asset_index_complete
    question: Every pack file is indexed.
    blocking: true
  - id: remote_input_no_authority
    question: Remote input cannot approve, execute, install packs, mutate settings, or issue tokens.
    blocking: true
  - id: route_idempotency
    question: Thread route decisions are replay-safe by idempotency key.
    blocking: true
  - id: draft_hash_expiry
    question: Draft approvals bind one sha256 body hash to an expiry and single-use receipt.
    blocking: true
