flow_id: defaultspack.chat_turn
version: 1
description: Profile-scoped chat turn orchestration.

transport:
  http:
    routes:
      - method: POST
        path: /v1/chat/completions
        fallback_block: blocks.chat.send
      - method: POST
        path: /api/chat/conversations/{id}/messages
        path_inject:
          id: conversation_id
        fallback_block: blocks.chat.send

inputs:
  conversation_id: string
  message: object
  profile_id: string?

outputs:
  ai_response: object
  route_model: object
  selected_tools:
    type: array
    value: "{{permitted_tools.tools || permitted_tools}}"
  audit_event: object

result:
  value: "{{persisted_turn.assistant_message || persisted_turn}}"

steps:
  - id: load_conversation
    type: function
    function: defaults.chat.get_conversation
    input:
      conversation_id: "{{input.conversation_id}}"
    output: conversation

  - id: load_active_profile
    type: function
    function: defaults.profile.load_active
    input:
      profile_id: "{{input.profile_id || conversation.metadata.profile_id}}"
    output: active_profile

  - id: load_profile_workspace
    type: function
    function: defaults.profile.workspace
    input:
      profile_id: "{{active_profile.profile_id}}"
    output: profile_workspace

  - id: detect_input_modalities
    type: function
    function: defaults.chat.detect_modalities
    input:
      message: "{{input.message}}"
    output: modalities

  - id: load_system_prompt
    type: function
    function: defaults.prompt.load_effective
    input:
      profile_id: "{{active_profile.profile_id}}"
      conversation_id: "{{input.conversation_id}}"
      system_prompt_id: "{{conversation.system_prompt_id}}"
      workspace: "{{profile_workspace}}"
    output: system_prompt

  - id: discover_relevant_tools
    type: function
    function: defaults.tools.select_relevant
    input:
      profile_id: "{{active_profile.profile_id}}"
      message: "{{input.message}}"
      workspace: "{{profile_workspace}}"
    output: tool_selection

  - id: apply_permissions
    type: function
    function: defaults.permissions.filter_tools
    input:
      profile_id: "{{active_profile.profile_id}}"
      tools: "{{tool_selection.tools}}"
      policy: "{{active_profile.policy}}"
      workspace: "{{profile_workspace}}"
    output: permitted_tools

  - id: route_model
    type: function
    function: defaults.ai.route_model
    input:
      conversation_id: "{{input.conversation_id}}"
      profile_id: "{{active_profile.profile_id}}"
      message: "{{input.message}}"
      modalities: "{{modalities}}"
      tools: "{{permitted_tools.tools}}"
      preferred_model: "{{conversation.model}}"
      requested_thinking_level: "{{input.params.thinking_level || input.thinking_level}}"
    output: route_model

  - id: maybe_run_vision_bridge
    type: function
    function: defaults.vision.describe_images
    when: "{{route_model.bridge_required}}"
    input:
      message: "{{input.message}}"
      model: "{{route_model.bridge_plan.model}}"
      conversation_id: "{{input.conversation_id}}"
    output: vision_bridge_result

  - id: compact_prompt_if_needed
    type: function
    function: defaults.prompt.compact_prompt
    input:
      profile_id: "{{active_profile.profile_id}}"
      prompt: "{{system_prompt}}"
      route_model: "{{route_model}}"
    output: prompt_compaction

  - id: build_ai_request
    type: function
    function: defaults.ai.build_request
    input:
      conversation_id: "{{input.conversation_id}}"
      message: "{{input.message}}"
      system_prompt: "{{prompt_compaction.prompt || system_prompt}}"
      vision_bridge_result: "{{vision_bridge_result}}"
      tools: "{{permitted_tools.tools}}"
      route_model: "{{route_model}}"
      params: "{{input.params}}"
      deepthink_enabled: "{{input.params.deepthink_enabled || input.deepthink_enabled}}"
    output: ai_request

  - id: call_ai
    type: function
    function: defaults.ai.complete
    input: "{{ai_request}}"
    output: ai_response

  - id: persist_turn
    type: function
    function: defaults.chat.persist_turn
    input:
      conversation_id: "{{input.conversation_id}}"
      message: "{{input.message}}"
      ai_response: "{{ai_response}}"
      route_model: "{{route_model}}"
      workspace: "{{profile_workspace}}"
    output: persisted_turn

  - id: audit
    type: function
    function: defaults.audit.record_event
    input:
      profile_id: "{{active_profile.profile_id}}"
      event_type: chat_turn
      route_model: "{{route_model}}"
      tools: "{{permitted_tools.tools}}"
      workspace: "{{profile_workspace}}"
    output: audit_event

  - id: post_turn
    type: subflow
    flow: "{{active_profile.post_turn_flow || active_profile.policy.post_turn_flow || profile_workspace.post_turn_flow}}"
    when: "{{active_profile.post_turn_flow || active_profile.policy.post_turn_flow || profile_workspace.post_turn_flow}}"
    input:
      conversation_id: "{{input.conversation_id}}"
      message: "{{input.message}}"
      ai_response: "{{ai_response}}"
      persisted_turn: "{{persisted_turn}}"
      audit_event: "{{audit_event}}"
      route_model: "{{route_model}}"
      workspace: "{{profile_workspace}}"
    output: post_turn
    on_error: continue
