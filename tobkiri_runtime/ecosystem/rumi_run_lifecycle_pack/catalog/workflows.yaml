workflows:
  default_execution: no_runtime_action
  ownership:
    owned:
    - agent_workroom_session
    - run_event_log
    - task_plan_contract
    - progress_event_contract
    - checkpoint_resume_contract
    - interrupt_redirect_cancel_contract
    - deterministic_replay_index
    - run_board_ui_contract
    handoff:
    - tool execution
    - browser action
    - desktop action
    - schedule execution
    - file persistence
    - metrics collection
    - subagent PR management
    - model routing
  items:
  - id: workroom_initialization
    purpose: Create a session, seed event log, and bind a human intervention policy.
    inputs:
    - local_records
    - evidence_ids
    produces:
    - review_packet
    - handoff_packet
    blocking_gates:
    - evidence_present
    - owner_boundary_checked
    - human_review_before_external_action
    handoffs:
    - defaultspack
    - rumi_default_tools_pack
    - rumi_operations_team_pack
    - rumi_model_catalog_pack
    execution: declarative_only
  - id: task_plan_progression
    purpose: Advance plan state from events without executing tools.
    inputs:
    - local_records
    - evidence_ids
    produces:
    - review_packet
    - handoff_packet
    blocking_gates:
    - evidence_present
    - owner_boundary_checked
    - human_review_before_external_action
    handoffs:
    - defaultspack
    - rumi_default_tools_pack
    - rumi_operations_team_pack
    - rumi_model_catalog_pack
    execution: declarative_only
  - id: checkpoint_resume
    purpose: Seal checkpoint and produce a reviewed resume packet.
    inputs:
    - local_records
    - evidence_ids
    produces:
    - review_packet
    - handoff_packet
    blocking_gates:
    - evidence_present
    - owner_boundary_checked
    - human_review_before_external_action
    handoffs:
    - defaultspack
    - rumi_default_tools_pack
    - rumi_operations_team_pack
    - rumi_model_catalog_pack
    execution: declarative_only
  - id: interrupt_redirect_cancel
    purpose: Apply human intervention to future events only.
    inputs:
    - local_records
    - evidence_ids
    produces:
    - review_packet
    - handoff_packet
    blocking_gates:
    - evidence_present
    - owner_boundary_checked
    - human_review_before_external_action
    handoffs:
    - defaultspack
    - rumi_default_tools_pack
    - rumi_operations_team_pack
    - rumi_model_catalog_pack
    execution: declarative_only
  - id: deterministic_replay
    purpose: Rebuild run state from ordered events and checkpoints.
    inputs:
    - local_records
    - evidence_ids
    produces:
    - review_packet
    - handoff_packet
    blocking_gates:
    - evidence_present
    - owner_boundary_checked
    - human_review_before_external_action
    handoffs:
    - defaultspack
    - rumi_default_tools_pack
    - rumi_operations_team_pack
    - rumi_model_catalog_pack
    execution: declarative_only
  - id: run_board_review_packet
    purpose: Render a run-board UI contract for human review.
    inputs:
    - local_records
    - evidence_ids
    produces:
    - review_packet
    - handoff_packet
    blocking_gates:
    - evidence_present
    - owner_boundary_checked
    - human_review_before_external_action
    handoffs:
    - defaultspack
    - rumi_default_tools_pack
    - rumi_operations_team_pack
    - rumi_model_catalog_pack
    execution: declarative_only
