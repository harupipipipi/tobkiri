profile:
  id: agent_workroom
  pack_id: rumi_run_lifecycle_pack
  mode: local_first_declarative
  default_presets:
  - safe_default
  - handoff_review
  - quality_gate
  owned_surfaces:
  - agent_workroom_session
  - run_event_log
  - task_plan_contract
  - progress_event_contract
  - checkpoint_resume_contract
  - interrupt_redirect_cancel_contract
  - deterministic_replay_index
  - run_board_ui_contract
  handoff_surfaces:
  - tool execution
  - browser action
  - desktop action
  - schedule execution
  - file persistence
  - metrics collection
  - subagent PR management
  - model routing
  review_contract:
    external_actions: handoff_only
    evidence_required: true
    human_review_required: true
