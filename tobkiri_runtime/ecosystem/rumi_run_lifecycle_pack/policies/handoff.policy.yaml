handoff_policy:
  default: do_not_execute_adjacent_runtime_action
  overlap_policy:
    tool_execution: handoff_to_rumi_default_tools_pack
    agent_service_choreography: handoff_to_rumi_operations_team_pack
    browser_action: handoff_to_rumi_default_tools_pack
    desktop_action: handoff_to_rumi_default_tools_pack
    schedule_execution: handoff_to_defaultspack
    file_persistence: handoff_to_defaultspack
    metrics_collection: handoff_to_defaultspack
    subagent_pr_management: handoff_to_rumi_operations_team_pack
    model_routing: handoff_to_rumi_model_catalog_pack
    workroom_state_contract: owned_by_rumi_run_lifecycle_pack
    replay_index: owned_by_rumi_run_lifecycle_pack
    tool_aliases: prefer_explicit_pack_namespace
  conflict_resolution:
  - Prefer the most specific owner surface.
  - Emit Handoff packets for adjacent runtime actions.
  - Require human review when approval, identity, citation, or safety state is uncertain.
