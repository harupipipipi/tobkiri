policy:
  id: rumi_document_intelligence_pack.safety
  default_network: none
  required_secrets: []
  executable_code: false
  must_record_evidence: true
  must_check_overlap_policy: true
  base_pack_promotion: disabled_without_maintainer_review
  handoff_required_for:
  - slide_sheet_doc_creation
  - web_research
  - image_or_scan_analysis
  - sensitive_document_review
  - tool_aliases
