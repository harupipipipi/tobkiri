<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tobkiri Setup</title>
  <script src="/setup/locales.js"></script>
  <script>
    (() => {
      try {
        const query = new URLSearchParams(window.location.search);
        const storedLocale = localStorage.getItem("tobkiri-locale")
          || localStorage.getItem("rumi-locale");
        const locale = window.TobkiriSetupI18n.normalize(
          query.get("locale") || storedLocale || "auto",
          navigator.language,
        );
        document.documentElement.lang = locale;
        // Only QA-complete LTR locales are enabled. Do not infer RTL support.
        document.documentElement.dir = "ltr";
        const requestedMode = query.get("color_mode");
        const mode = requestedMode === "light" || requestedMode === "dark"
          ? requestedMode
          : localStorage.getItem("tobkiri-color-mode")
            || localStorage.getItem("rumi-color-mode")
            || "dark";
        document.documentElement.classList.toggle("dark", mode === "dark");
      } catch (_) {
        // Setup stays usable when browser storage is unavailable.
      }
    })();
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f0f4f9;
      --surface: #fff;
      --surface-muted: #e8eaed;
      --ink: #1f1f1f;
      --muted: #444746;
      --line: #d9dde3;
      --accent: #0b57d0;
      --accent-soft: #e8f0fe;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      min-height: 100dvh;
      margin: 0;
      padding: 32px clamp(16px, 4vw, 48px) 48px;
      overflow-x: clip;
      color: var(--ink);
      background: var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 1rem;
      line-height: 1.5;
    }
    body::before {
      position: fixed;
      inset: 0;
      content: "";
      pointer-events: none;
      background: radial-gradient(circle at 18% 0%, rgba(11, 87, 208, 0.1), transparent 34%);
    }
    main { position: relative; width: min(1080px, 100%); margin: 0 auto; }
    .topbar, .topbar-actions, .brand, .selection-footer, .actions {
      display: flex;
      align-items: center;
    }
    .topbar { justify-content: space-between; gap: 20px; margin-bottom: 30px; }
    .brand { gap: 11px; font-weight: 700; }
    .brand-mark {
      width: 38px;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: var(--surface);
      object-fit: cover;
    }
    .topbar-actions { gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .locale-control { color: var(--muted); font-size: 0.8125rem; }
    select {
      min-height: 2.5rem;
      max-width: 10rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 30px 6px 11px;
      color: var(--ink);
      background: var(--surface);
      font: inherit;
    }
    .setup-progress { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 0.75rem; }
    .setup-progress i { width: 28px; height: 3px; border-radius: 99px; background: var(--accent); }
    .hero { padding-bottom: 20px; }
    .eyebrow { margin-bottom: 8px; color: var(--accent); font-size: 0.75rem; font-weight: 700; }
    h1 { margin: 0 0 8px; font-size: clamp(1.625rem, 4vw, 2.25rem); line-height: 1.2; }
    h2 { margin: 0 0 12px; font-size: 1.125rem; }
    h3 { margin: 0 0 8px; font-size: 0.9375rem; }
    p { margin: 0; color: var(--muted); }
    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
      gap: 20px;
      align-items: start;
    }
    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      background: var(--surface);
      box-shadow: 0 24px 70px -58px rgba(17, 24, 39, 0.7);
    }
    .profile-card, .included-group, .review-card {
      margin-top: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 16px;
      background: var(--surface);
    }
    .profile-card.selected { border-color: var(--accent); background: var(--accent-soft); }
    .profile-choice {
      width: 100%;
      border-radius: 14px;
      color: var(--ink);
      background: transparent;
      text-align: start;
    }
    .profile-choice-copy { display: grid; gap: 4px; }
    .profile-choice-copy strong { font-size: 1.125rem; }
    .pill {
      display: inline-flex;
      width: fit-content;
      margin-top: 8px;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--accent);
      font-size: 0.75rem;
    }
    .included-group summary { cursor: pointer; color: var(--ink); font-weight: 700; }
    .included-description { margin: 8px 0; font-size: 0.875rem; }
    .pack-list { display: grid; gap: 6px; margin: 12px 0 0; padding: 0; list-style: none; }
    .pack-list li { min-width: 0; border-radius: 10px; padding: 9px; background: var(--surface-muted); }
    .technical-id { display: block; margin-top: 3px; color: var(--muted); font-size: 0.75rem; overflow-wrap: anywhere; }
    .selection-footer { justify-content: space-between; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
    .selection-summary { color: var(--muted); font-size: 0.8125rem; }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      color: #fff;
      background: var(--accent);
      font: inherit;
      cursor: pointer;
    }
    button.secondary { color: var(--ink); background: var(--surface-muted); }
    button:disabled { opacity: 0.55; cursor: default; }
    button:focus-visible, summary:focus-visible, select:focus-visible, .status-live:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent);
      outline-offset: 3px;
    }
    .meta { display: grid; gap: 10px; font-size: 0.875rem; }
    .meta strong { display: block; margin-bottom: 3px; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; }
    .actions { gap: 10px; margin: 12px 0; }
    .status { min-height: 180px; border-radius: 8px; padding: 14px; color: var(--muted); background: var(--surface-muted); font-size: 0.8125rem; }
    .status ul { margin: 8px 0 0; padding-inline-start: 18px; }
    .status details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
    .status pre { max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .status[data-tone="pending"] { background: var(--accent-soft); }
    .status[data-tone="success"] { color: var(--success); background: var(--success-soft); }
    .status[data-tone="error"] { color: var(--danger); background: var(--danger-soft); }
    .debug-description { margin-top: 8px; }
    .debug-copy { margin-top: 10px; }
    .progress { width: 100%; height: 6px; margin-top: 12px; accent-color: var(--accent); }
    .progress[hidden] { display: none; }
    .visually-hidden {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0, 0, 0, 0) !important;
      white-space: nowrap !important;
      border: 0 !important;
    }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 520px) {
      body { padding: 20px 12px 32px; }
      .panel { padding: 16px; }
      .topbar { align-items: flex-start; }
      .selection-footer { align-items: stretch; flex-direction: column; }
      .selection-footer button { width: 100%; }
      .setup-progress span { display: none; }
    }
    @media (max-height: 560px) {
      body { padding-top: 16px; }
      .topbar { margin-bottom: 18px; }
      .hero { padding-bottom: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    :root.dark {
      color-scheme: dark;
      --bg: #131314;
      --surface: #282a2c;
      --surface-muted: #333537;
      --ink: #e3e3e3;
      --muted: #c4c7c5;
      --line: #444746;
      --accent: #a8c7fa;
      --accent-soft: #1e3557;
      --success: #4ade80;
      --success-soft: #11291a;
      --danger: #f87171;
      --danger-soft: #321717;
    }
  </style>
</head>
<body aria-busy="true">
  <main aria-labelledby="setup-title">
    <div class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/setup/assets/tobkiri-launcher-icon.png" alt="Tobkiri" data-i18n-alt="brandAlt">
        <span>Tobkiri Launcher</span>
      </div>
      <div class="topbar-actions">
        <label class="locale-control">
          <span class="visually-hidden" data-i18n="languageLabel">表示言語</span>
          <select id="locale" aria-label="表示言語" data-i18n-aria-label="languageLabel">
            <option value="ja" data-i18n="languageJapanese">日本語</option>
            <option value="en" data-i18n="languageEnglish">English</option>
          </select>
        </label>
        <button id="back" class="secondary" type="button" data-i18n="back">← 戻る</button>
        <div class="setup-progress" role="progressbar" aria-valuemin="1" aria-valuemax="2" aria-valuenow="2" aria-label="初期セットアップ、ステップ 2 / 2" data-i18n-aria-label="setupProgress">
          <span data-i18n="setupProgressShort">初期セットアップ</span><i></i>
        </div>
      </div>
    </div>
    <section class="hero">
      <div class="eyebrow" data-i18n="eyebrow">ステップ 2 · 起動時の pack</div>
      <h1 id="setup-title" data-i18n="title">基本セットを選ぶ</h1>
      <p data-i18n="heroDescription">Authority Kernel が検証した Defaults Profile を確認して、標準の基本セットで始めます。</p>
    </section>
    <section class="grid">
      <section class="panel" aria-labelledby="choose-title">
        <h2 id="choose-title" data-i18n="chooseTitle">まずは基本セット</h2>
        <p id="choose-description" data-i18n="chooseDescription">Defaults Profile は 1 つの検証済み単位として有効化されます。含まれる pack は確認できますが、ここで個別に変更することはできません。</p>
        <div id="profile-root" aria-describedby="choose-description"></div>
        <div class="selection-footer">
          <span id="selection-summary" class="selection-summary" data-i18n="selectionPlaceholder">pack を選択してください</span>
          <button id="install-selected" type="button" disabled data-i18n="installReady">この構成で始める →</button>
        </div>
      </section>
      <section class="panel" aria-labelledby="state-title">
        <h2 id="state-title" data-i18n="stateTitle">セットアップ状態</h2>
        <div class="meta">
          <div><strong data-i18n="selectedHeading">選択内容</strong><span id="selection" data-i18n="loading">読み込み中…</span></div>
          <div><strong data-i18n="migrationHeading">移行</strong><span id="migration" data-i18n="loading">読み込み中…</span></div>
        </div>
        <div class="actions">
          <button id="refresh" class="secondary" type="button" data-i18n="refresh">状態を再読み込み</button>
        </div>
        <div id="status" class="status">
          <div id="status-live" class="status-live" role="status" aria-live="polite" aria-atomic="true" tabindex="-1"></div>
          <div id="debug-state"></div>
        </div>
        <progress id="install-progress" class="progress" aria-label="セットアップの進行状況" data-i18n-aria-label="progressLabel" hidden></progress>
      </section>
    </section>
  </main>
  <script>
    const SETUP_API_VERSION = "io.tobkiri.setup-state.v4";
    const SETUP_OPERATION_ID = "defaults.activate";
    const PANEL_CSRF_STORAGE_KEY = "rumi-panel-csrf";
    const LOCALE_STORAGE_KEY = "tobkiri-locale";
    const i18n = window.TobkiriSetupI18n;
    const rootEl = document.getElementById("profile-root");
    const statusEl = document.getElementById("status");
    const statusLiveEl = document.getElementById("status-live");
    const debugStateEl = document.getElementById("debug-state");
    const selectionEl = document.getElementById("selection");
    const selectionSummaryEl = document.getElementById("selection-summary");
    const migrationEl = document.getElementById("migration");
    const installButton = document.getElementById("install-selected");
    const installProgress = document.getElementById("install-progress");
    const refreshButton = document.getElementById("refresh");
    const localeSelect = document.getElementById("locale");
    const returnTo = safeReturnTo(new URLSearchParams(window.location.search).get("return_to"));
    let currentLocale = i18n.normalize(
      new URLSearchParams(window.location.search).get("locale")
        || localStorageValue(LOCALE_STORAGE_KEY)
        || localStorageValue("rumi-locale")
        || "auto",
      navigator.language,
    );
    let currentPayload = null;
    let profileSelected = false;
    let profileReviewed = false;
    let installInProgress = false;

    class SetupRequestError extends Error {
      constructor(status, code) {
        super("setup_request_failed");
        this.name = "SetupRequestError";
        this.status = Number(status) || 0;
        this.code = isSafeTechnicalId(code) ? code : "request_failed";
      }
    }

    function tr(key, values = {}) {
      return i18n.translate(currentLocale, key, values);
    }

    function localStorageValue(key) {
      try { return window.localStorage.getItem(key) || ""; } catch { return ""; }
    }

    function applyLocale() {
      document.documentElement.lang = currentLocale;
      document.documentElement.dir = "ltr";
      document.title = tr("documentTitle");
      localeSelect.value = currentLocale;
      for (const element of document.querySelectorAll("[data-i18n]")) {
        element.textContent = tr(element.dataset.i18n);
      }
      for (const element of document.querySelectorAll("[data-i18n-aria-label]")) {
        element.setAttribute("aria-label", tr(element.dataset.i18nAriaLabel));
      }
      for (const element of document.querySelectorAll("[data-i18n-alt]")) {
        element.setAttribute("alt", tr(element.dataset.i18nAlt));
      }
    }

    function setStatus(label, diagnostic, rows, tone = "neutral", options = {}) {
      statusEl.dataset.tone = tone;
      statusLiveEl.setAttribute("role", tone === "error" ? "alert" : "status");
      statusLiveEl.setAttribute("aria-live", tone === "error" ? "assertive" : "polite");
      const fragment = document.createDocumentFragment();
      const title = document.createElement("h3");
      const list = document.createElement("ul");
      title.textContent = label;
      for (const row of rows && rows.length ? rows : [tr("statusDefault")]) {
        const item = document.createElement("li");
        item.textContent = row;
        list.appendChild(item);
      }
      fragment.appendChild(title);
      fragment.appendChild(list);
      statusLiveEl.replaceChildren(fragment);
      renderDebugState(diagnostic);
      if (options.focus) window.requestAnimationFrame(() => statusLiveEl.focus());
    }

    function setInstallProgress(state) {
      installInProgress = state === "pending";
      installButton.setAttribute("aria-busy", String(installInProgress));
      installButton.textContent = tr(
        state === "pending" ? "installPending" : state === "success" ? "installSuccess" : "installReady",
      );
      installButton.disabled = installInProgress || !profileSelected || currentPayload?.state !== "review_required";
      refreshButton.disabled = installInProgress;
      localeSelect.disabled = installInProgress;
      document.body.setAttribute("aria-busy", String(installInProgress));
      installProgress.hidden = !installInProgress;
      if (installInProgress) installProgress.removeAttribute("value");
    }

    function renderDebugState(payload) {
      const safePayload = sanitizeDebugPayload(payload);
      debugStateEl.replaceChildren();
      if (!Object.keys(safePayload).length) return;
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const description = document.createElement("p");
      const pre = document.createElement("pre");
      const copy = document.createElement("button");
      const safeText = JSON.stringify(safePayload, null, 2);
      summary.textContent = tr("debugSummary");
      description.className = "debug-description";
      description.textContent = tr("debugDescription");
      pre.textContent = safeText;
      copy.type = "button";
      copy.className = "secondary debug-copy";
      copy.textContent = tr("debugCopy");
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(safeText);
          copy.textContent = tr("debugCopied");
        } catch {
          copy.textContent = tr("debugCopyFailed");
        }
      });
      details.append(summary, description, pre, copy);
      debugStateEl.appendChild(details);
    }

    function sanitizeDebugPayload(payload) {
      if (!payload || typeof payload !== "object") return {};
      const safe = {};
      if (isSafeTechnicalId(payload.state)) safe.state = payload.state;
      if (Number.isInteger(payload.status)) safe.status = payload.status;
      if (isSafeTechnicalId(payload.code)) safe.code = payload.code;
      if (Number.isInteger(payload.pack_count)) safe.pack_count = payload.pack_count;
      if (isSafeTechnicalId(payload.profile_id)) safe.profile_id = payload.profile_id;
      return safe;
    }

    function isSafeTechnicalId(value) {
      const candidate = String(value || "");
      return /^[a-z][a-z0-9_.-]{0,79}$/i.test(candidate)
        && !/(?:token|secret|password|credential|api[_-]?key|cookie|bearer)/i.test(candidate);
    }

    function safeReturnTo(value) {
      if (!value) return "";
      try {
        const url = new URL(value, window.location.origin);
        const panelPath = url.pathname === "/panel" || url.pathname.startsWith("/panel/");
        return url.origin === window.location.origin && panelPath
          ? url.pathname + url.search + url.hash
          : "";
      } catch { return ""; }
    }

    function panelCsrfToken() {
      try { return window.sessionStorage.getItem(PANEL_CSRF_STORAGE_KEY) || ""; } catch { return ""; }
    }

    function requestHeaders(options) {
      const headers = { ...((options && options.headers) || {}) };
      const method = String((options && options.method) || "GET").toUpperCase();
      if (["POST", "PUT", "DELETE", "PATCH"].includes(method)) {
        const csrf = panelCsrfToken();
        if (csrf) headers["X-Rumi-CSRF"] = csrf;
      }
      return headers;
    }

    function setupErrorCode(payload) {
      if (!payload || typeof payload !== "object") return "request_failed";
      for (const candidate of [payload.code, payload.error_code, payload.state, payload.reason]) {
        if (isSafeTechnicalId(candidate)) return String(candidate);
      }
      return "request_failed";
    }

    async function getJson(url, options) {
      const response = await fetch(url, {
        ...(options || {}),
        credentials: "same-origin",
        headers: requestHeaders(options),
      });
      const envelope = await response.json().catch(() => ({}));
      const payload = envelope.data || envelope;
      if (!response.ok || envelope.success === false || payload?.success === false) {
        throw new SetupRequestError(response.status, setupErrorCode(payload));
      }
      return payload;
    }

    function validateSetupProjection(payload) {
      const profile = payload?.recommended_default_profile;
      if (
        payload?.setup_api_version !== SETUP_API_VERSION
        || !["review_required", "active", "activation_denied"].includes(payload.state)
        || !Array.isArray(payload.packs)
        || !profile
        || profile.available !== true
        || profile.profile_id !== "defaults"
        || !Array.isArray(profile.packs)
        || !profile.confirmation
        || typeof profile.confirmation !== "object"
      ) {
        throw new SetupRequestError(502, "invalid_setup_contract");
      }
      return payload;
    }

    function mapSetupError(error) {
      const status = error instanceof SetupRequestError ? error.status : 0;
      const code = error instanceof SetupRequestError ? error.code : "network_unavailable";
      let key = "errorUnknown";
      if (!status) key = "errorNetwork";
      else if (status === 401 || status === 403) key = "errorUnauthorized";
      else if (status === 409 || code === "review_required") key = "errorConflict";
      else if (status === 410 || code === "legacy_setup_retired") key = "errorConflict";
      else if (status === 400 || status === 422 || code === "invalid_setup_contract") key = "errorValidation";
      else if (status >= 500) key = "errorServer";
      return { message: tr(key), diagnostic: { status, code } };
    }

    function profileName(profile) {
      return String(profile?.name || tr("profileFallbackName"));
    }

    function displayPackName(pack) {
      return String(pack?.display_name || tr("genericPackName"));
    }

    function renderIncludedPacks(profile) {
      const details = document.createElement("details");
      const summary = document.createElement("summary");
      const description = document.createElement("p");
      const list = document.createElement("ul");
      details.className = "included-group";
      details.setAttribute("role", "group");
      details.setAttribute("aria-label", tr("individualGroupLabel"));
      summary.textContent = tr("showAll", { count: profile.packs.length });
      description.className = "included-description";
      description.textContent = tr("individualGroupDescription");
      list.className = "pack-list";
      for (const pack of profile.packs) {
        const item = document.createElement("li");
        const name = document.createElement("strong");
        const technical = document.createElement("code");
        name.textContent = displayPackName(pack);
        technical.className = "technical-id";
        technical.textContent = tr("technicalPackId", {
          id: isSafeTechnicalId(pack.pack_id) ? pack.pack_id : tr("debugRedacted"),
        });
        item.append(name, technical);
        list.appendChild(item);
      }
      details.append(summary, description, list);
      return details;
    }

    function renderProfile(payload) {
      const profile = payload.recommended_default_profile;
      rootEl.replaceChildren();
      const card = document.createElement("article");
      const choice = document.createElement("button");
      const copy = document.createElement("span");
      const name = document.createElement("strong");
      const description = document.createElement("span");
      const pill = document.createElement("span");
      card.className = "profile-card" + (profileSelected ? " selected" : "");
      card.setAttribute("role", "group");
      card.setAttribute("aria-label", tr("profileGroupLabel"));
      choice.type = "button";
      choice.className = "profile-choice";
      choice.setAttribute("aria-pressed", String(profileSelected));
      choice.setAttribute("aria-label", tr("select") + ": " + profileName(profile));
      choice.disabled = payload.state !== "review_required";
      copy.className = "profile-choice-copy";
      name.textContent = profileName(profile);
      description.textContent = tr("profileDescription", { count: profile.packs.length });
      pill.className = "pill";
      pill.textContent = payload.state === "active" ? tr("selected") : tr("recommended");
      copy.append(name, description, pill);
      choice.appendChild(copy);
      choice.addEventListener("click", () => {
        profileSelected = !profileSelected;
        profileReviewed = false;
        renderProfile(currentPayload);
        announceSelection();
      });
      card.appendChild(choice);
      rootEl.append(card, renderIncludedPacks(profile));
      updateSelection();
    }

    function updateSelection() {
      const count = currentPayload?.recommended_default_profile?.packs?.length || 0;
      selectionEl.textContent = profileSelected
        ? tr("selectionProfile", { count })
        : tr("selectionNone");
      selectionSummaryEl.textContent = profileSelected
        ? tr("selectionProfileSummary", { count })
        : tr("selectionPlaceholder");
      selectionSummaryEl.setAttribute("aria-label", selectionSummaryEl.textContent);
      installButton.disabled = installInProgress
        || !profileSelected
        || currentPayload?.state !== "review_required";
    }

    function announceSelection() {
      const count = currentPayload?.recommended_default_profile?.packs?.length || 0;
      setStatus(tr("selectionChangedTitle"), {
        state: "review_required",
        profile_id: currentPayload?.recommended_default_profile?.profile_id,
        pack_count: count,
      }, [profileSelected
        ? tr("selectionProfileSummary", { count })
        : tr("selectionPlaceholder")]);
    }

    function renderReview() {
      const existing = document.getElementById("install-review");
      if (existing) existing.remove();
      const profile = currentPayload.recommended_default_profile;
      const review = document.createElement("section");
      const heading = document.createElement("h3");
      const description = document.createElement("p");
      review.id = "install-review";
      review.className = "review-card";
      review.setAttribute("aria-labelledby", "install-review-title");
      heading.id = "install-review-title";
      heading.textContent = tr("reviewSectionTitle");
      description.textContent = tr("profileContains", { count: profile.packs.length });
      review.append(heading, description, renderIncludedPacks(profile));
      rootEl.appendChild(review);
    }

    function renderPayloadStatus(payload, options = {}) {
      const profile = payload.recommended_default_profile;
      const diagnostic = {
        state: payload.state,
        profile_id: profile.profile_id,
        pack_count: profile.packs.length,
      };
      if (payload.state === "active") {
        migrationEl.textContent = tr("migrationReady");
        setStatus(tr("installedTitle"), diagnostic, [
          tr("installedProfileRow", { count: profile.packs.length }),
          tr("migrationsNone"),
        ], "success");
        redirectIfActive(payload);
      } else if (payload.state === "activation_denied") {
        migrationEl.textContent = tr("migrationUnavailable");
        setStatus(tr("installFailedTitle"), diagnostic, [
          tr("errorConflict"),
          tr("previousSelectionSafe"),
        ], "error", { focus: options.focusErrors !== false });
        refreshButton.textContent = tr("retry");
      } else {
        migrationEl.textContent = tr("migrationIncluded");
        setStatus(tr("loadedTitle"), diagnostic, [
          tr("summarySelected", { names: profileSelected ? profileName(profile) : tr("selectionNone") }),
          tr("summaryProfileCount", { count: profile.packs.length }),
          tr("summaryMigration", { status: tr("migrationIncluded") }),
        ]);
      }
    }

    function redirectIfActive(payload) {
      if (!returnTo || payload.state !== "active") return false;
      setStatus(tr("redirectingTitle"), { state: "redirecting" }, [tr("redirectingRow")], "success");
      window.setTimeout(() => window.location.assign(returnTo), 100);
      return true;
    }

    async function installSelectedProfile() {
      if (!profileSelected || currentPayload?.state !== "review_required") {
        setStatus(tr("validationNoSelectionTitle"), {}, [tr("validationNoSelectionRow")], "error", { focus: true });
        return;
      }
      if (!profileReviewed) {
        profileReviewed = true;
        renderReview();
        setStatus(tr("reviewTitle"), {
          state: "review_required",
          profile_id: currentPayload.recommended_default_profile.profile_id,
          pack_count: currentPayload.recommended_default_profile.packs.length,
        }, [tr("reviewInstruction"), tr("reviewRepeat")], "pending", { focus: true });
        return;
      }
      setInstallProgress("pending");
      setStatus(tr("installingTitle"), {
        state: "installing",
        profile_id: currentPayload.recommended_default_profile.profile_id,
        pack_count: currentPayload.recommended_default_profile.packs.length,
      }, [
        tr("installingProfileRow", { count: currentPayload.recommended_default_profile.packs.length }),
        tr("installingMigration"),
      ], "pending");
      try {
        const result = await getJson("/api/setup/packs/install", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            setup_api_version: SETUP_API_VERSION,
            operation_id: SETUP_OPERATION_ID,
            confirmed: true,
            // This exact server-issued object is deliberately opaque to the UI.
            confirmation: currentPayload.recommended_default_profile.confirmation,
          }),
        });
        if (result?.setup_api_version !== SETUP_API_VERSION || result.state !== "active") {
          throw new SetupRequestError(502, "invalid_setup_contract");
        }
        currentPayload = { ...currentPayload, state: result.state };
        profileSelected = result.state === "active";
        setInstallProgress("success");
        renderProfile(currentPayload);
        renderPayloadStatus(currentPayload, { focusErrors: true });
      } catch (error) {
        setInstallProgress("error");
        profileReviewed = false;
        const mapped = mapSetupError(error);
        setStatus(tr("installFailedTitle"), mapped.diagnostic, [
          tr("installFailedRow"),
          mapped.message,
          tr("previousSelectionSafe"),
        ], "error", { focus: true });
        refreshButton.textContent = tr("retry");
      }
    }

    async function load(options = {}) {
      document.body.setAttribute("aria-busy", "true");
      refreshButton.disabled = true;
      refreshButton.textContent = tr("refresh");
      if (!options.preserveStatus) {
        setStatus(tr("loadingTitle"), { state: "loading" }, [tr("loadingRow")], "pending");
      }
      try {
        currentPayload = validateSetupProjection(await getJson("/api/setup/packs"));
        profileSelected = currentPayload.state === "active";
        profileReviewed = false;
        renderProfile(currentPayload);
        renderPayloadStatus(currentPayload, { focusErrors: options.focusErrors });
        return true;
      } catch (error) {
        currentPayload = null;
        rootEl.replaceChildren();
        const mapped = mapSetupError(error);
        setStatus(tr("loadFailedTitle"), mapped.diagnostic, [tr("loadFailedRow"), mapped.message], "error", { focus: true });
        refreshButton.textContent = tr("retry");
        return false;
      } finally {
        document.body.setAttribute("aria-busy", "false");
        refreshButton.disabled = false;
        localeSelect.disabled = false;
        updateSelection();
      }
    }

    localeSelect.addEventListener("change", () => {
      currentLocale = i18n.normalize(localeSelect.value, navigator.language);
      try { window.localStorage.setItem(LOCALE_STORAGE_KEY, currentLocale); } catch (_) {}
      applyLocale();
      if (currentPayload) {
        renderProfile(currentPayload);
        renderPayloadStatus(currentPayload, { focusErrors: false });
      } else {
        load({ focusErrors: false });
      }
    });
    refreshButton.addEventListener("click", () => load({ focusErrors: true }));
    document.getElementById("back").addEventListener("click", () => window.location.assign("/panel/setup"));
    installButton.addEventListener("click", installSelectedProfile);
    applyLocale();
    load({ focusErrors: true });
  </script>
</body>
</html>
