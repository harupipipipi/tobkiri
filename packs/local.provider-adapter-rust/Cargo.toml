[package]
name = "tobkiri-pack-provider-adapter-rust"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
component = ["dep:wit-bindgen"]

[dependencies]
ordered-python-compat = { path = "../ordered-python-compat" }
provider_model_access = { package = "tobkiri-pack-provider-model-access-rust", path = "../local.provider-model-access-rust", default-features = false }
wit-bindgen = { workspace = true, optional = true }
