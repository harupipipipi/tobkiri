[package]
name = "tobkiri-pack-provider-registry-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
component = ["dep:serde_json", "dep:tobkiri-canon", "dep:wit-bindgen"]

[dependencies]
ordered-python-compat = { path = "../ordered-python-compat" }
provider_model_access = { package = "tobkiri-pack-provider-model-access-rust", path = "../local.provider-model-access-rust", default-features = false }
serde_json = { version = "=1.0.154", optional = true }
sha2 = "=0.10.9"
tobkiri-canon = { path = "../../crates/tobkiri-canon", optional = true }
wit-bindgen = { version = "=0.62.0", optional = true }
zeroize = "=1.9.1"

[dev-dependencies]
anyhow = "=1.0.104"
serde_json = "=1.0.154"
tobkiri-canon = { path = "../../crates/tobkiri-canon" }

