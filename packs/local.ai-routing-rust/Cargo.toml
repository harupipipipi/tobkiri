tobkiri-ai-stream-normalizer-core = { path = "../local.ai-stream-normalizer-rust/core" }
tobkiri-ai-tool-bridge-core = { path = "../local.ai-tool-bridge-rust/core" }
tobkiri-ai-usage-cost-core = { path = "../local.ai-usage-cost-rust/core" }
wit-bindgen = { workspace = true, optional = true }
