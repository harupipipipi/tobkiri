[package]
name = "tobkiri-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
closed-request-metrics = ["tobkiri-gate/closed-request-metrics"]

[dependencies]
async-trait.workspace = true
tobkiri-canon.workspace = true
tobkiri-gate.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
sha2.workspace = true
hex.workspace = true
thiserror.workspace = true
libc.workspace = true
getrandom.workspace = true
chacha20poly1305.workspace = true
keyring.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_SystemServices"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
