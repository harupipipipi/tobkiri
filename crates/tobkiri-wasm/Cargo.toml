[package]
name = "tobkiri-wasm"
version = "0.1.0"
edition = "2024"

[features]
# Keep the checksum-pinned private SQLite producer available for experiments.
# Production DATA uses the bounded native Store backend.
private-sqlite-experiment = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
getrandom.workspace = true
libc.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true
tobkiri-canon = { path = "../tobkiri-canon" }
tobkiri-gate = { path = "../tobkiri-gate" }
tobkiri-store = { path = "../tobkiri-store" }
tobkiri-manifest = { path = "../tobkiri-manifest" }
tobkiri-profile = { path = "../tobkiri-profile" }
tobkiri-flow = { path = "../tobkiri-flow" }
tobkiri-wit = { path = "../tobkiri-wit" }

[dev-dependencies]
wat.workspace = true
tempfile.workspace = true

[build-dependencies]
sha2.workspace = true
serde_json.workspace = true
