name: Flutter Mobile

on:
  pull_request:
    branches: [master, soon, codex/pack-architecture-program-soon]
    paths:
      - "tobkiri_mobile/**"
      - ".github/workflows/flutter-mobile.yml"
  push:
    branches: [master, soon]
    paths:
      - "tobkiri_mobile/**"
      - ".github/workflows/flutter-mobile.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: tobkiri_mobile
        run: flutter pub get

      - name: Check formatting
        working-directory: tobkiri_mobile
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        working-directory: tobkiri_mobile
        run: flutter analyze

      - name: Test
        working-directory: tobkiri_mobile
        run: flutter test
