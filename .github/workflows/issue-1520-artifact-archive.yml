name: Issue 1520 private artifact archive

# Preserves the exact pinned producer and rpds artifact bytes beyond their
# original retention. The bytes only ever go into repository-private Actions
# artifacts (90-day maximum): never a Release, package, git object or external
# store. Re-run before expiry (every ~80 days) and pin the new archive run in
# tools/python313-producer/artifact-archive-pins.json.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: Pinned artifact to archive
        type: choice
        options: [producer-cli, original-components, rpds]
        default: rpds
      origin:
        description: original (the pinned source run) or previous-archive (re-archive the pinned archive run)
        type: choice
        options: [original, previous-archive]
        default: original

permissions:
  contents: read
  actions: read

concurrency:
  group: issue-1520-artifact-archive-${{ inputs.kind }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Authenticate the source, verify every pinned byte and write provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_KIND: ${{ inputs.kind }}
          ARCHIVE_ORIGIN: ${{ inputs.origin }}
        run: >-
          python3 -B tools/python313-producer/artifact_archive.py archive
          --kind "$ARCHIVE_KIND"
          --origin "$ARCHIVE_ORIGIN"
          --destination "$RUNNER_TEMP/archive"
      - name: Re-upload the identical bytes privately for the 90-day maximum
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ inputs.kind }}
          path: ${{ runner.temp }}/archive/data/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Retain the provenance of the archived bytes
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ inputs.kind }}-provenance
          path: ${{ runner.temp }}/archive/provenance/
          if-no-files-found: error
          retention-days: 90
