name: Issue 1520 pure native DATA handoff
on:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - 'tobkiri_launcher/harness-native/src/preparation.rs'
      - 'tobkiri_launcher/harness-native/src/lib.rs'
      - 'tobkiri_launcher/harness-native/src/bootstrap_runtime.rs'
      - 'tobkiri_launcher/harness-native/src/bootstrap_domain_cleanup_tests.rs'
      - 'crates/tobkiri-wasm/src/native_setup_store.rs'
      - 'crates/tobkiri-wasm/src/native_setup_store_tests.rs'
      - '.github/workflows/issue-1520-native-data-handoff.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-1520-native-data-handoff-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  cancellation-lineage:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Actual Store cancellation, custody and original-budget regressions
        run: cargo test --locked -p tobkiri-wasm --lib native_setup_store::tests -- --test-threads=1
  same-invocation:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Actual prepared component and original-owner DATA regressions
        run: cargo test --locked -p tobkiri-harness-native --lib preparation::tests -- --test-threads=1
      - name: Preserve actual domain DATA and the original cleanup failure
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/harness-native-domain-cleanup.log" --expected-passed 2 --
          cargo test --locked -p tobkiri-harness-native --lib
          bootstrap_runtime::domain_cleanup_tests -- --test-threads=1
      - name: Strict library validation
        run: cargo clippy --locked -p tobkiri-harness-native --lib -- -D warnings
