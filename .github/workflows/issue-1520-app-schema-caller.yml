name: Issue 1520 actual App schema caller reference
'on':
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - tools/python313-producer/app_schema_oracle.py
      - tools/python313-producer/app_schema_kernel_lane.py
      - tools/python313-producer/app_schema_backend_lane.py
      - tools/python313-producer/app_schema_backend_check.py
      - tools/python313-producer/schema_kernel/**
      - tools/python313-producer/schema_kernel_translate.py
      - tools/python313-producer/schema_kernel_native_check.py
      - tools/python313-producer/schema_kernel_api_checks.py
      - tools/python313-producer/schema_kernel_observation.py
      - tools/python313-producer/schema_*_checks.py
      - tools/python313-producer/bundle_catalog_oracle.py
      - tools/python313-producer/build_schema_kernel.py
      - tools/python313-producer/schema_kernel_oracle.py
      - tools/python313-producer/fetch_schema.py
      - tobkiri_runtime/tobkiri_protocol/**
      - .github/workflows/issue-1520-app-schema-caller.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-1520-app-schema-caller-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  native-caller-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: ''
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13.16
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/checkout@v4
        with:
          ref: 54e7da008997a3eb45876cbe18459dba9902cc9d
          path: app-schema-original
          persist-credentials: false
      - name: Restore checksum-bound real library inputs
        run: >-
          python3 -B tools/python313-producer/fetch_schema.py
          --destination "$RUNNER_TEMP/app-schema-inputs"
      - name: Prepare shared real-file caller fixtures
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/app-schema-caller"
          python3 -B tools/python313-producer/app_schema_oracle.py prepare \
            "$RUNNER_TEMP/app-schema-caller/fixtures"
      - name: Record the actual pinned original caller
        run: |
          set -euo pipefail
          python3 -S -B tools/python313-producer/app_schema_oracle.py run \
            --source-kind original \
            --source "$GITHUB_WORKSPACE/app-schema-original/tobkiri_runtime" \
            --inputs "$RUNNER_TEMP/app-schema-inputs" \
            --fixtures "$RUNNER_TEMP/app-schema-caller/fixtures" \
            --bundle-source "$GITHUB_WORKSPACE/app-schema-original/tobkiri_runtime" \
            --output "$RUNNER_TEMP/app-schema-caller/original.json"
      - name: Record the actual current caller
        run: |
          set -euo pipefail
          python3 -S -B tools/python313-producer/app_schema_oracle.py run \
            --source-kind current \
            --source "$GITHUB_WORKSPACE/tobkiri_runtime" \
            --inputs "$RUNNER_TEMP/app-schema-inputs" \
            --fixtures "$RUNNER_TEMP/app-schema-caller/fixtures" \
            --bundle-source "$GITHUB_WORKSPACE/app-schema-original/tobkiri_runtime" \
            --output "$RUNNER_TEMP/app-schema-caller/current.json"
      - name: Compare the complete recorded caller contract
        run: |
          set -euo pipefail
          python3 -B tools/python313-producer/app_schema_oracle.py compare \
            --original "$RUNNER_TEMP/app-schema-caller/original.json" \
            --current "$RUNNER_TEMP/app-schema-caller/current.json" \
            --output "$RUNNER_TEMP/app-schema-caller/comparison.json"
      - name: Prepare the independent original 64-case library reference
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path
          import os, subprocess, sys
          root = Path(os.environ['RUNNER_TEMP'])
          packages = root/'app-schema-inputs/packages'
          env = {**os.environ, 'PYTHONPATH': os.pathsep.join(
              str(path) for path in sorted(packages.iterdir()) if path.is_dir())}
          subprocess.run([sys.executable, '-S', '-B',
                          'tools/python313-producer/schema_kernel_oracle.py',
                          '--source', str(Path(os.environ['GITHUB_WORKSPACE'])/
                                          'app-schema-original/tobkiri_runtime'),
                          '--output', str(root/'app-schema-caller/library-reference.json')],
                         env=env, check=True)
          PY
      - name: Restore authenticated registry inputs for the existing kernel
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/app-schema-cargo-home"
          cargo fetch --locked --manifest-path tools/python313-producer/schema_kernel/Cargo.toml
          mkdir "$RUNNER_TEMP/app-schema-archives"
          python3 -B - <<'PY'
          from pathlib import Path
          import os, shutil, sys
          sys.path.insert(0, 'tools/python313-producer')
          from build_schema_kernel import restore_registry_vendor
          root = Path(os.environ['RUNNER_TEMP'])
          for path in (root/'app-schema-cargo-home/registry/cache').glob('*/*.crate'):
              target = root/'app-schema-archives'/path.name
              if target.exists():
                  raise ValueError('ambiguous registry archive name')
              shutil.copyfile(path, target)
          restore_registry_vendor(Path('tools/python313-producer/schema_kernel').resolve(),
                                  root/'app-schema-archives', root/'app-schema-vendor')
          PY
      - name: Build and verify the existing Rust kernel against the independent library corpus
        run: |
          set -euo pipefail
          python3 -S -B tools/python313-producer/schema_kernel_native_check.py \
            --source "$GITHUB_WORKSPACE/tools/python313-producer/schema_kernel" \
            --vendor "$RUNNER_TEMP/app-schema-vendor" \
            --inputs "$RUNNER_TEMP/app-schema-inputs" \
            --reference "$RUNNER_TEMP/app-schema-caller/library-reference.json" \
            --cargo-home "$RUNNER_TEMP/app-schema-cargo-home" \
            --destination "$RUNNER_TEMP/app-schema-native"
      - name: Record the actual Rust-connected App caller in a fresh process
        run: |
          set -euo pipefail
          python3 -S -B tools/python313-producer/app_schema_oracle.py run \
            --source-kind kernel \
            --source "$GITHUB_WORKSPACE/tobkiri_runtime" \
            --inputs "$RUNNER_TEMP/app-schema-inputs" \
            --fixtures "$RUNNER_TEMP/app-schema-caller/fixtures" \
            --bundle-source "$GITHUB_WORKSPACE/app-schema-original/tobkiri_runtime" \
            --kernel-precheck "$RUNNER_TEMP/app-schema-native" \
            --output "$RUNNER_TEMP/app-schema-caller/kernel.json"
      - name: Compare the Rust-connected App caller with the actual original
        run: |
          set -euo pipefail
          python3 -B tools/python313-producer/app_schema_oracle.py compare \
            --original "$RUNNER_TEMP/app-schema-caller/original.json" \
            --current "$RUNNER_TEMP/app-schema-caller/kernel.json" \
            --current-kind kernel \
            --output "$RUNNER_TEMP/app-schema-caller/kernel-comparison.json"
      - name: Build the distinct feature-enabled App frame backend and compare all64
        run: |
          set -euo pipefail
          python3 -S -B tools/python313-producer/schema_kernel_native_check.py --app-backend \
            --source "$GITHUB_WORKSPACE/tools/python313-producer/schema_kernel" \
            --vendor "$RUNNER_TEMP/app-schema-vendor" \
            --inputs "$RUNNER_TEMP/app-schema-inputs" \
            --reference "$RUNNER_TEMP/app-schema-caller/library-reference.json" \
            --cargo-home "$RUNNER_TEMP/app-schema-cargo-home" \
            --destination "$RUNNER_TEMP/app-backend-native"
      - name: Execute the same actual App corpus with its explicitly selected backend
        run: |
          set -euo pipefail
          python3 -S -B tools/python313-producer/app_schema_oracle.py run \
            --source-kind backend \
            --source "$GITHUB_WORKSPACE/tobkiri_runtime" \
            --inputs "$RUNNER_TEMP/app-schema-inputs" \
            --fixtures "$RUNNER_TEMP/app-schema-caller/fixtures" \
            --bundle-source "$GITHUB_WORKSPACE/app-schema-original/tobkiri_runtime" \
            --kernel-precheck "$RUNNER_TEMP/app-backend-native" \
            --output "$RUNNER_TEMP/app-schema-caller/backend.json"
          python3 -B tools/python313-producer/app_schema_oracle.py compare \
            --original "$RUNNER_TEMP/app-schema-caller/original.json" \
            --current "$RUNNER_TEMP/app-schema-caller/backend.json" --current-kind backend \
            --output "$RUNNER_TEMP/app-schema-caller/backend-comparison.json"
      - name: Retain bounded reference metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-schema-caller-reference
          path: |
            ${{ runner.temp }}/app-schema-caller/original.json
            ${{ runner.temp }}/app-schema-caller/current.json
            ${{ runner.temp }}/app-schema-caller/comparison.json
            ${{ runner.temp }}/app-schema-caller/kernel.json
            ${{ runner.temp }}/app-schema-caller/kernel-comparison.json
            ${{ runner.temp }}/app-schema-caller/backend.json
            ${{ runner.temp }}/app-schema-caller/backend-comparison.json
            ${{ runner.temp }}/app-backend-native/schema-kernel-native-check.json
            ${{ runner.temp }}/app-backend-native/cargo.log
            ${{ runner.temp }}/app-schema-native/schema-kernel-native-check.json
            ${{ runner.temp }}/app-schema-caller/fixtures/fixture-index.json
          retention-days: 14
          if-no-files-found: warn
