name: Issue 1520 pinned Unicode 15.1 reference

'on':
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - tools/unicode15_1_reference.py
      - tobkiri_launcher/harness-native/src/unicode15_1*.rs
      - .github/workflows/issue-1520-unicode15-1.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-1520-unicode15-1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  reference:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Fetch only pinned primary Unicode and CPython sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/unicode15_1_reference.py fetch
          --output "$RUNNER_TEMP/unicode15-1-primary"
      - name: Generate static tables and fresh independent Unicode observations
        run: >-
          python3 -B tools/unicode15_1_reference.py generate
          --inputs "$RUNNER_TEMP/unicode15-1-primary"
          --output "$RUNNER_TEMP/unicode15-1-reference"
      - name: Retain generated source and bounded reference data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicode15-1-generated-reference
          path: |
            ${{ runner.temp }}/unicode15-1-reference/unicode15_1_data.rs
            ${{ runner.temp }}/unicode15-1-reference/COPYING.unicode
            ${{ runner.temp }}/unicode15-1-reference/summary.json
            ${{ runner.temp }}/unicode15-1-reference/fixtures.json
          if-no-files-found: warn
  native-primitives:
    needs: reference
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: unicode15-1-generated-reference
          path: ${{ runner.temp }}/unicode15-1-reference
      - name: Require the committed static tables to match this fresh generation
        run: >-
          cmp tobkiri_launcher/harness-native/src/unicode15_1_data.rs
          "$RUNNER_TEMP/unicode15-1-reference/unicode15_1_data.rs"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Execute every portable Unicode primitive regression
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/unicode15-1-unit.log" --expected-passed 11 --
          cargo test --locked -p tobkiri-harness-native --lib
          unicode15_1::tests:: -- --test-threads=1
      - name: Compare official NFC sequences and full code-point observations
        env:
          TOBKIRI_UNICODE15_1_FIXTURES: ${{ runner.temp }}/unicode15-1-reference/fixtures.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/unicode15-1-reference.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          unicode15_1::tests::original_reference_ci::original_reference_driver
          -- --ignored --exact --test-threads=1 --nocapture
      - name: Strict library validation with the original dependency lock
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p tobkiri-harness-native --lib -- -D warnings
      - name: Retain bounded primitive observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unicode15-1-native-observations-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/unicode15-1-reference/summary.json
            ${{ runner.temp }}/unicode15-1-reference/native-observations.json
            ${{ runner.temp }}/unicode15-1-unit.log*
            ${{ runner.temp }}/unicode15-1-reference.log*
          if-no-files-found: warn
