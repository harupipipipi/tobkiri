  official-python-parity:
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the pinned official Linux WAC executable
        run: >-
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3
          --max-filesize 22922992 --output "$RUNNER_TEMP/wac-cli"
          https://github.com/bytecodealliance/wac/releases/download/v0.12.0/wac-cli-x86_64-unknown-linux-musl
      - name: Produce and bind the current official Python component
        run: |
          chmod +x "$RUNNER_TEMP/wac-cli"
          python3 -B tools/quality/issue_1520_ci.py prepare-python \
            --work-dir "$RUNNER_TEMP/issue-1520-python" --composer "$RUNNER_TEMP/wac-cli"
      - name: Transfer the authenticated component and producer receipt
        uses: actions/upload-artifact@v4
        with:
          name: official-python-component
          path: |
            ${{ runner.temp }}/issue-1520-python/shell-policy.wasm
            ${{ runner.temp }}/issue-1520-python/shell-policy.build.json
          if-no-files-found: error
      - name: Retain actual Python producer receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: official-python-parity-receipts
          path: |
            ${{ runner.temp }}/issue-1520-python/python-fixture.receipt.json
            ${{ runner.temp }}/issue-1520-python/shell-policy.build.json
            ${{ runner.temp }}/issue-1520-python/pack/pack.json
          if-no-files-found: error

  optional-private-sqlite-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_sqlite_experiment }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Set the runner-local private SQL producer directory
        run: echo "TOBKIRI_SQL_PRODUCER_DIR=$RUNNER_TEMP/sqlite-core" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Fetch and authenticate the pinned private SQL toolchain
        shell: bash
        run: |
          tobkiri_sdk_archive="$RUNNER_TEMP/sdk34.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$tobkiri_sdk_archive" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          python3 - "$tobkiri_sdk_archive" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          pin = json.loads(Path("tools/wasm-sqlite/host-toolchain-sdk34-x86_64-linux.json").read_text())
          if archive.stat().st_size != pin["archive_bytes"]:
              raise SystemExit("private SQL SDK archive size mismatch")
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              while block := stream.read(65536):
                  digest.update(block)
          if digest.hexdigest() != pin["archive_sha256"]:
              raise SystemExit("private SQL SDK archive digest mismatch")
          PY
          mkdir "$RUNNER_TEMP/sdk34"
          tar -xzf "$tobkiri_sdk_archive" -C "$RUNNER_TEMP/sdk34"
      - name: Produce the exact private SQL module before host builds
        run: >-
          python3 -B tools/wasm-sqlite/build-linux.py
          --archive "$RUNNER_TEMP/sdk34.tar.gz"
          --sdk "$RUNNER_TEMP/sdk34/wasi-sdk-34.0-x86_64-linux"
          --out "$TOBKIRI_SQL_PRODUCER_DIR"
          --disk-floor-bytes 5905580032
      - name: Compile optional private SQLite experiment with verified producer inputs
        run: cargo check -p tobkiri-wasm --features private-sqlite-experiment --locked

  migration-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All legacy units and final hosts must satisfy the Issue
        run: python3 tools/quality/issue_1520_gate.py --stage complete
