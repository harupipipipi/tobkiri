name: Issue 1520 Rust migration

on:
  pull_request:
    branches: [soon]
  push:
    branches: [codex/issue-1520-rust-core]
  workflow_dispatch:
    inputs:
      private_sqlite_experiment:
        description: Build the optional private SQLite producer experiment
        type: boolean
        default: false
        required: false

jobs:
  foundations:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-wasip2
          components: rustfmt, clippy
      - name: Boundary checker regression
        run: python3 tools/quality/test_issue_1520_gate.py
      - name: Core and host boundaries
        run: python3 tools/quality/issue_1520_gate.py --stage foundation
      - name: Verify migration inventory coverage
        run: python3 -B migration/tests/test_inventory.py
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: Build actual typed Wasm test guests
        run: cargo build --manifest-path crates/test-guests/Cargo.toml --workspace --locked --target wasm32-wasip2
      - name: Build actual M2 Pack components and pin their hashes
        run: python3 -B packs/build.py --target-dir "$CARGO_TARGET_DIR"
      - name: Pure Flow dependency graph
        run: |
          cargo tree --locked -p tobkiri-flow > flow-dependencies.txt
          if rg 'wasmtime|rusqlite|reqwest' flow-dependencies.txt; then exit 1; fi
      - name: Rust unit and integration checks
        run: cargo test --workspace --locked
      - name: Strict Rust lint
        run: cargo clippy --workspace --all-targets --locked --no-deps -- -D warnings
      - name: Python guest SDK contracts
        run: python3 -B -m unittest discover -s sdk/python/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
          cache-dependency-path: sdk/js/package-lock.json
      - name: Install locked JS guest SDK build dependencies
        working-directory: sdk/js
        run: npm ci --ignore-scripts
      - name: JS guest SDK contracts
        working-directory: sdk/js
        run: npm test

  optional-private-sqlite-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.private_sqlite_experiment }}
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-target
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      TOBKIRI_SQL_PRODUCER_DIR: ${{ runner.temp }}/sqlite-core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Fetch and authenticate the pinned private SQL toolchain
        shell: bash
        run: |
          tobkiri_sdk_archive="$RUNNER_TEMP/sdk34.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --output "$tobkiri_sdk_archive" \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
          python3 - "$tobkiri_sdk_archive" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          pin = json.loads(Path("tools/wasm-sqlite/host-toolchain-sdk34-x86_64-linux.json").read_text())
          if archive.stat().st_size != pin["archive_bytes"]:
              raise SystemExit("private SQL SDK archive size mismatch")
          digest = hashlib.sha256()
          with archive.open("rb") as stream:
              while block := stream.read(65536):
                  digest.update(block)
          if digest.hexdigest() != pin["archive_sha256"]:
              raise SystemExit("private SQL SDK archive digest mismatch")
          PY
          mkdir "$RUNNER_TEMP/sdk34"
          tar -xzf "$tobkiri_sdk_archive" -C "$RUNNER_TEMP/sdk34"
      - name: Produce the exact private SQL module before host builds
        run: >-
          python3 -B tools/wasm-sqlite/build-linux.py
          --archive "$RUNNER_TEMP/sdk34.tar.gz"
          --sdk "$RUNNER_TEMP/sdk34/wasi-sdk-34.0-x86_64-linux"
          --out "$TOBKIRI_SQL_PRODUCER_DIR"
          --disk-floor-bytes 5905580032
      - name: Verify optional private SQLite experiment provenance
        run: cargo check -p tobkiri-wasm --features private-sqlite-experiment --locked

  migration-completion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: All legacy units and final hosts must satisfy the Issue
        run: python3 tools/quality/issue_1520_gate.py --stage complete
