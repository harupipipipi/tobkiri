# CI Health Check - MiMo V2.5 Pro
name: Dev Health Check

on:
  workflow_dispatch:
  push:
    branches: [soon]
  pull_request:
    branches: [soon, codex/pack-architecture-program-soon]

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run development health check
        run: bash scripts/dev-health-check.sh
