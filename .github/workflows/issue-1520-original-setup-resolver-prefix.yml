name: Issue 1520 original Setup resolver prefix

'on':
  workflow_dispatch:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - tools/original_setup_resolver_prefix_reference.py
      - tools/original_setup_candidate_selection_reference.py
      - tools/original_setup_review_reference.py
      - tools/original_setup_shell_reference.py
      - tools/original_inactive_registry_reference.py
      - tools/original_catalog_prefix_reference.py
      - tools/original_active_profile_fixtures.py
      - tools/original_authority_reference.py
      - tools/original_publication_reference.py
      - tobkiri_launcher/harness-native/src/bootstrap_resolver_edges*.rs
      - tobkiri_launcher/harness-native/src/bootstrap_predecessor.rs
      - tobkiri_launcher/harness-native/src/bootstrap_confirmation.rs
      - tobkiri_launcher/harness-native/src/bootstrap_listing.rs
      - tobkiri_launcher/harness-native/src/original_development_handover.rs
      - tobkiri_launcher/harness-native/src/original_inactive_registration_ci.rs
      - tobkiri_launcher/harness-native/src/original_setup_candidate_selection_tests.rs
      - .github/workflows/issue-1520-original-setup-resolver-prefix.yml

permissions:
  contents: read

concurrency:
  group: issue-1520-original-setup-resolver-prefix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-setup-resolver-prefix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cf025f1eeab31a3daa2861b1f26a025c6954b6e
          path: original-setup-resolver-prefix-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install original-lock-pinned reference dependencies
        run: |
          python3 -B tools/original_setup_review_reference.py requirements \
            --original-root "$GITHUB_WORKSPACE/original-setup-resolver-prefix-source" \
            --output "$RUNNER_TEMP/original-setup-resolver-prefix-requirements.txt"
          python3 -m pip install --disable-pip-version-check --ignore-installed \
            --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/original-setup-resolver-prefix-requirements.txt"
      - name: Observe the original resolver lock and packaged Shell verification
        run: |
          python3 -B tools/original_setup_resolver_prefix_reference.py \
            --original-root "$GITHUB_WORKSPACE/original-setup-resolver-prefix-source" \
            --output "$RUNNER_TEMP/original-setup-resolver-prefix"
      - name: Verify pinned original Shell artifact and captured input cases
        working-directory: original-setup-resolver-prefix-source
        run: python3 -B -m unittest discover -s tests -p test_captured_setup_inputs.py -v
      - uses: dtolnay/rust-toolchain@1.94.0
        if: matrix.os == 'ubuntu-22.04'
      - name: Compare the funded Rust bindings before and after the original dynamic call
        if: matrix.os == 'ubuntu-22.04'
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_INCREMENTAL: '0'
          TOBKIRI_ORIGINAL_STATIC_EDGES_REFERENCE: ${{ runner.temp }}/original-setup-resolver-prefix/summary.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/original-setup-resolver-prefix/static-edges.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          bootstrap_runtime::resolver_edges::tests::original_static_edge_reference_driver
          -- --ignored --exact --test-threads=1 --nocapture
      - name: Compare the physical Rust predecessor reads with the pinned original
        if: matrix.os == 'ubuntu-22.04'
        env:
          CARGO_BUILD_JOBS: '1'
          CARGO_INCREMENTAL: '0'
          TOBKIRI_ORIGINAL_BOOTSTRAP_PREDECESSOR_REFERENCE: ${{ runner.temp }}/original-setup-resolver-prefix/shell.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/original-setup-resolver-prefix/predecessor.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::candidate_selection_tests::predecessor_rechecks_registry_and_pointer_in_the_resolver_scope
          -- --exact --test-threads=1 --nocapture
      - name: Compare the inactive registry and journal authentication with the pinned original
        if: matrix.os == 'ubuntu-22.04'
        env:
          TOBKIRI_ORIGINAL_INACTIVE_REGISTRY_REFERENCE: ${{ runner.temp }}/original-setup-resolver-prefix/inactive-registry.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/original-setup-resolver-prefix/inactive-registry.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::candidate_selection_tests::inactive_predecessor_reads_the_original_registry_and_checks_the_fence
          -- --exact --test-threads=1 --nocapture
      - name: Check native admission of the complete confirmation document
        if: matrix.os == 'ubuntu-22.04'
        env:
          TOBKIRI_ORIGINAL_INACTIVE_REGISTRY_REFERENCE: ${{ runner.temp }}/original-setup-resolver-prefix/inactive-registry.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/original-setup-resolver-prefix/confirmation.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          bootstrap_runtime::predecessor::confirmation::tests::fresh_confirmation_validates_scope_fields_and_full_digest
          -- --exact --test-threads=1 --nocapture
      - name: Compare native registration CAS with the pinned original
        if: matrix.os == 'ubuntu-22.04'
        env:
          TOBKIRI_ORIGINAL_INACTIVE_REGISTRY_REFERENCE: ${{ runner.temp }}/original-setup-resolver-prefix/inactive-registry.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/original-setup-resolver-prefix/registration.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::inactive_registration_ci::original_inactive_registration_driver
          -- --ignored --exact --test-threads=1 --nocapture
      - name: Check native admission of the linked preview and listing
        if: matrix.os == 'ubuntu-22.04'
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/original-setup-resolver-prefix/listing.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          bootstrap_runtime::listing::tests::preview_and_listing_require_the_same_reviewed_confirmation
          -- --exact --test-threads=1 --nocapture
      - name: Retain bounded original observation metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-setup-resolver-prefix-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/original-setup-resolver-prefix/summary.json
            ${{ runner.temp }}/original-setup-resolver-prefix/shell.json
            ${{ runner.temp }}/original-setup-resolver-prefix/inactive-registry.json
            ${{ runner.temp }}/original-setup-resolver-prefix/static-edges.log*
            ${{ runner.temp }}/original-setup-resolver-prefix/predecessor.log*
            ${{ runner.temp }}/original-setup-resolver-prefix/inactive-registry.log*
            ${{ runner.temp }}/original-setup-resolver-prefix/confirmation.log*
            ${{ runner.temp }}/original-setup-resolver-prefix/registration.log*
            ${{ runner.temp }}/original-setup-resolver-prefix/listing.log*
          if-no-files-found: warn
          retention-days: 7
