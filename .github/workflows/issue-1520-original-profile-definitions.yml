name: Issue 1520 original Profile definition prefix

'on':
  workflow_dispatch:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - tools/original_profile_definition_prefix_reference.py
      - tools/original_profile_successor_entry_reference.py
      - tobkiri_launcher/harness-native/src/bootstrap_catalog.rs
      - tobkiri_launcher/harness-native/src/bootstrap_review*.rs
      - tobkiri_launcher/harness-native/src/original_active_profile.rs
      - tobkiri_launcher/harness-native/src/original_profile_definitions*.rs
      - tobkiri_launcher/harness-native/src/original_profile_successor_selection*.rs
      - tobkiri_launcher/harness-native/src/original_profile_publication.rs
      - tobkiri_launcher/harness-native/src/original_setup_candidate_selection*.rs
      - .github/workflows/issue-1520-original-profile-definitions.yml

permissions:
  contents: read

concurrency:
  group: issue-1520-original-profile-definitions-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-profile-definitions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cf025f1eeab31a3daa2861b1f26a025c6954b6e
          path: original-definitions-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install original-lock-pinned reference dependencies
        run: |
          python3 -B tools/original_setup_review_reference.py requirements \
            --original-root "$GITHUB_WORKSPACE/original-definitions-source" \
            --output "$RUNNER_TEMP/original-definitions-requirements.txt"
          python3 -m pip install --disable-pip-version-check --ignore-installed \
            --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/original-definitions-requirements.txt"
      - name: Prepare independent original catalog resource fixture
        run: >-
          python3 -B tools/original_catalog_prefix_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --output "$RUNNER_TEMP/original-catalog-prefix"
      - name: Run original constructor and list to the first migration boundary
        id: definition_prefix
        run: >-
          python3 -B tools/original_profile_definition_prefix_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --catalog-fixtures "$RUNNER_TEMP/original-catalog-prefix/summary.json"
          --output "$RUNNER_TEMP/original-profile-definitions"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - name: Verify private definition JSON capacity and unchanged strict errors
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-definitions-json.log" --expected-passed 4 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::json::definitions_funding_tests::
          -- --test-threads=1 --nocapture
      - name: Verify native definition constructors and held journal lock mechanics
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-definitions-unit.log" --expected-passed 7 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::tests
          -- --test-threads=1 --nocapture
      - name: Check fresh Setup root custody and original pointer errors
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-setup-candidate-unit.log" --expected-passed 3 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::candidate_selection_tests
          -- --test-threads=1 --nocapture
      - name: Check exact legacy successor arguments and capacity
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-successor-selection-unit.log" --expected-passed 4 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::definitions_model::successor_selection::tests
          -- --test-threads=1 --nocapture
      - name: Execute the direct native interval against all original fixtures
        id: native_definitions
        # Actual RuntimeOwner allocation-owner admission currently supports
        # macOS. Linux retains the portable mechanism and original reference checks.
        if: ${{ runner.os == 'macOS' }}
        env:
          TOBKIRI_TEST_NATIVE_HARNESS_CI: "1"
          TOBKIRI_ORIGINAL_PROFILE_DEFINITIONS_FIXTURES: ${{ runner.temp }}/original-profile-definitions/summary.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-definitions-reference.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::reference_ci::original_profile_definitions_reference_driver
          -- --ignored --exact --test-threads=1 --nocapture
      - name: Independently compare native results and actual filesystem cleanup
        if: ${{ !cancelled() && steps.native_definitions.outcome != 'skipped' && runner.os == 'macOS' }}
        run: >-
          python3 -B tools/original_profile_definition_prefix_reference.py compare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --fixtures "$RUNNER_TEMP/original-profile-definitions/summary.json"
          --observations "$RUNNER_TEMP/original-profile-definitions/native-observations.json"
          --output "$RUNNER_TEMP/original-profile-definitions/comparison.json"
      - name: Strict native definition library validation
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p tobkiri-harness-native --lib -- -D warnings
      - name: Observe the original locked successor migration through its next entry
        if: ${{ !cancelled() && steps.definition_prefix.outcome == 'success' }}
        run: >-
          python3 -B tools/original_profile_successor_entry_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --fixtures "$RUNNER_TEMP/original-profile-definitions/summary.json"
          --output "$RUNNER_TEMP/original-profile-successor-entry"
      - name: Retain bounded observations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-profile-definitions-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/original-profile-definitions/summary.json
            ${{ runner.temp }}/original-profile-definitions/native-observations.json
            ${{ runner.temp }}/original-profile-definitions/comparison.json
            ${{ runner.temp }}/original-profile-successor-entry/summary.json
            ${{ runner.temp }}/native-definitions-unit.log*
            ${{ runner.temp }}/native-definitions-json.log*
            ${{ runner.temp }}/native-definitions-reference.log*
            ${{ runner.temp }}/native-setup-candidate-unit.log*
            ${{ runner.temp }}/native-successor-selection-unit.log*
            ${{ runner.temp }}/original-catalog-prefix/summary.json
          if-no-files-found: warn
          retention-days: 7
