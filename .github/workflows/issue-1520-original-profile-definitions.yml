name: Issue 1520 original Profile definition prefix

'on':
  workflow_dispatch:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - tools/original_profile_definition_prefix_reference.py
      - tools/original_profile_successor_entry_reference.py
      - tools/original_profile_display_name_reference.py
      - tools/original_profile_retired_projection_reference.py
      - tools/original_bootstrap_template_reference.py
      - tools/original_external_pack_catalog_reference.py
      - tools/original_external_closure_reference.py
      - tools/original_host_extension_catalog_reference.py
      - tobkiri_launcher/harness-native/src/bootstrap_admitted_closure.rs
      - tobkiri_launcher/harness-native/src/original_recovery_authority.rs
      - tobkiri_launcher/harness-native/src/bootstrap_catalog.rs
      - tobkiri_launcher/harness-native/src/bootstrap_review*.rs
      - tobkiri_launcher/harness-native/src/original_active_profile.rs
      - tobkiri_launcher/harness-native/src/original_authority_io.rs
      - tobkiri_launcher/harness-native/src/original_authority_json.rs
      - tobkiri_launcher/harness-native/src/original_profile_definitions*.rs
      - tobkiri_launcher/harness-native/src/original_external_catalog*.rs
      - tobkiri_launcher/harness-native/src/original_profile_catalog*.rs
      - tobkiri_launcher/harness-native/src/original_shell_*.rs
      - tobkiri_launcher/harness-native/src/original_profile_successor_selection*.rs
      - tobkiri_launcher/harness-native/src/original_profile_publication.rs
      - tobkiri_launcher/harness-native/src/original_profile_publication_io.rs
      - tobkiri_launcher/harness-native/src/original_setup_candidate_selection*.rs
      - .github/workflows/issue-1520-original-profile-definitions.yml

permissions:
  contents: read

concurrency:
  group: issue-1520-original-profile-definitions-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-profile-definitions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cf025f1eeab31a3daa2861b1f26a025c6954b6e
          path: original-definitions-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install original-lock-pinned reference dependencies
        run: |
          python3 -B tools/original_setup_review_reference.py requirements \
            --original-root "$GITHUB_WORKSPACE/original-definitions-source" \
            --output "$RUNNER_TEMP/original-definitions-requirements.txt"
          python3 -m pip install --disable-pip-version-check --ignore-installed \
            --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/original-definitions-requirements.txt"
      - name: Prepare independent original catalog resource fixture
        run: >-
          python3 -B tools/original_catalog_prefix_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --output "$RUNNER_TEMP/original-catalog-prefix"
      - name: Run original constructor and list to the first migration boundary
        id: definition_prefix
        run: >-
          python3 -B tools/original_profile_definition_prefix_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --catalog-fixtures "$RUNNER_TEMP/original-catalog-prefix/summary.json"
          --output "$RUNNER_TEMP/original-profile-definitions"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - name: Verify private definition JSON capacity and unchanged strict errors
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-definitions-json.log" --expected-passed 4 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::json::definitions_funding_tests::
          -- --test-threads=1 --nocapture
      - name: Verify template result is bound to the actual catalog and getter
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-template-data.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          bootstrap_runtime::catalog::tests::bootstrap_template_data_requires_same_catalog_getter_and_profile_key
          -- --exact
      - name: Verify native definition constructors and held journal lock mechanics
        env:
          TOBKIRI_DISPLAY_NAME_REPAIR_FIXTURE: ${{ runner.temp }}/original-profile-display-name
          TOBKIRI_RETIRED_PROJECTION_MIGRATION_FIXTURE: ${{ runner.temp }}/original-profile-retired-projection
          TOBKIRI_BOOTSTRAP_TEMPLATE_FIXTURE: ${{ runner.temp }}/original-profile-bootstrap-template
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-definitions-unit.log" --expected-passed 18 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::tests
          -- --test-threads=1 --nocapture
      - name: Compare native display-name writes with the fixed original registry
        run: >-
          python3 -B tools/original_profile_display_name_reference.py
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --fixture "$RUNNER_TEMP/original-profile-display-name"
      - name: Compare native retired Pack projection writes with the fixed original registry
        run: >-
          python3 -B tools/original_profile_retired_projection_reference.py
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --fixture "$RUNNER_TEMP/original-profile-retired-projection"
      - name: Compare native first-install template registration with the original registry
        run: >-
          python3 -B tools/original_bootstrap_template_reference.py
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --fixture "$RUNNER_TEMP/original-profile-bootstrap-template"
      - name: Install pinned signed Pack producer dependencies
        id: original_admission_dependencies
        run: |
          python3 -B - "$RUNNER_TEMP/original-pack-admission-requirements.txt" <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, "tools")
          from original_authority_reference import requirements
          requirements(Path("original-definitions-source"), Path(sys.argv[1]),
                       packages=("cryptography", "cffi", "pycparser"))
          PY
          python3 -m pip install --disable-pip-version-check --ignore-installed \
            --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/original-pack-admission-requirements.txt"
      - name: Observe the original source catalog and real signed admission registry
        run: >-
          python3 -B tools/original_external_pack_catalog_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --output "$RUNNER_TEMP/original-external-catalog"
      - name: Compare the original bundled catalog, authentication and CAS reads
        env:
          TOBKIRI_EXTERNAL_CATALOG_FIXTURE: ${{ runner.temp }}/original-external-catalog/summary.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-external-io.log" --expected-passed 15 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::external_catalog::
          -- --test-threads=1 --nocapture
      - name: Check original Authority initialization and journal cleanup
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-recovery-authority.log" --expected-passed 2 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::recovery_authority::tests::
          -- --test-threads=1 --nocapture
      - name: Observe original admitted Pack dependency closure and independent Host reads
        run: >-
          python3 -B tools/original_external_closure_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --output "$RUNNER_TEMP/original-external-closure"
      - name: Compare native signed closure manifest rereads to original Pack rows
        env:
          TOBKIRI_EXTERNAL_CLOSURE_FIXTURE: ${{ runner.temp }}/original-external-closure/summary.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-external-closure.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::external_catalog::tests::ordinary_closure_rereads_the_original_signed_manifest_rows
          -- --test-threads=1 --nocapture
      - name: Observe original signed Host Extension compatibility projection
        if: ${{ !cancelled() && steps.original_admission_dependencies.conclusion == 'success' }}
        run: >-
          python3 -B tools/original_host_extension_catalog_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --output "$RUNNER_TEMP/original-host-extension-catalog"
      - name: Check fresh Setup root custody and original pointer errors
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-setup-candidate-unit.log" --expected-passed 12 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::candidate_selection_tests
          -- --test-threads=1 --nocapture
      - name: Check physical catalog binding and the fresh resolver reread
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-catalog-resources-unit.log" --expected-passed 7 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::catalog::tests
          -- --test-threads=1 --nocapture
      - name: Check exact legacy successor arguments and capacity
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-successor-selection-unit.log" --expected-passed 4 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::definitions_model::successor_selection::tests
          -- --test-threads=1 --nocapture
      - name: Execute the direct native interval against all original fixtures
        id: native_definitions
        # Actual RuntimeOwner allocation-owner admission currently supports
        # macOS. Linux retains the portable mechanism and original reference checks.
        if: ${{ runner.os == 'macOS' }}
        env:
          TOBKIRI_TEST_NATIVE_HARNESS_CI: "1"
          TOBKIRI_ORIGINAL_PROFILE_DEFINITIONS_FIXTURES: ${{ runner.temp }}/original-profile-definitions/summary.json
        run: >-
          python3 -B tools/quality/issue_1520_ci.py cargo-test
          --log "$RUNNER_TEMP/native-definitions-reference.log" --expected-passed 1 --
          cargo test --locked -p tobkiri-harness-native --lib
          original_authority::io::publication::definitions::reference_ci::original_profile_definitions_reference_driver
          -- --ignored --exact --test-threads=1 --nocapture
      - name: Independently compare native results and actual filesystem cleanup
        if: ${{ !cancelled() && steps.native_definitions.outcome != 'skipped' && runner.os == 'macOS' }}
        run: >-
          python3 -B tools/original_profile_definition_prefix_reference.py compare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --fixtures "$RUNNER_TEMP/original-profile-definitions/summary.json"
          --observations "$RUNNER_TEMP/original-profile-definitions/native-observations.json"
          --output "$RUNNER_TEMP/original-profile-definitions/comparison.json"
      - name: Strict native definition library validation
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p tobkiri-harness-native --lib -- -D warnings
      - name: Observe the original locked successor migration through its next entry
        if: ${{ !cancelled() && steps.definition_prefix.outcome == 'success' }}
        run: >-
          python3 -B tools/original_profile_successor_entry_reference.py prepare
          --original-root "$GITHUB_WORKSPACE/original-definitions-source"
          --fixtures "$RUNNER_TEMP/original-profile-definitions/summary.json"
          --output "$RUNNER_TEMP/original-profile-successor-entry"
      - name: Retain bounded observations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-profile-definitions-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/original-profile-definitions/summary.json
            ${{ runner.temp }}/original-profile-definitions/native-observations.json
            ${{ runner.temp }}/original-profile-definitions/comparison.json
            ${{ runner.temp }}/original-profile-successor-entry/summary.json
            ${{ runner.temp }}/original-profile-display-name/comparison.json
            ${{ runner.temp }}/original-profile-retired-projection/comparison.json
            ${{ runner.temp }}/original-profile-bootstrap-template/comparison.json
            ${{ runner.temp }}/native-definitions-unit.log*
            ${{ runner.temp }}/native-definitions-json.log*
            ${{ runner.temp }}/native-template-data.log*
            ${{ runner.temp }}/native-external-io.log*
            ${{ runner.temp }}/native-definitions-reference.log*
            ${{ runner.temp }}/native-setup-candidate-unit.log*
            ${{ runner.temp }}/native-catalog-resources-unit.log*
            ${{ runner.temp }}/native-recovery-authority.log*
            ${{ runner.temp }}/native-external-closure.log*
            ${{ runner.temp }}/original-external-closure/summary.json
            ${{ runner.temp }}/original-host-extension-catalog/summary.json
            ${{ runner.temp }}/native-successor-selection-unit.log*
            ${{ runner.temp }}/original-catalog-prefix/summary.json
          if-no-files-found: warn
          retention-days: 7
