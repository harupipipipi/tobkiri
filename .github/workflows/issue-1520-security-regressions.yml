name: Issue 1520 legacy security regressions

on:
  workflow_dispatch:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - '.github/workflows/issue-1520-security-regressions.yml'
      - '.github/scripts/install_locked_python_test_dependencies.py'
      - 'scripts/quality/compact_test_runner.py'
      - 'tobkiri_runtime/core_runtime/**'
      - 'tobkiri_runtime/ecosystem/defaultspack/blocks/**'
      - 'tobkiri_runtime/ecosystem/defaultspack/domain/**'
      - 'tobkiri_runtime/ecosystem/rumi_*_pack/**'
      - 'tobkiri_runtime/tests/**'
      - 'tobkiri_runtime/requirements*.txt'
  pull_request:
    branches: [soon]
    paths:
      - '.github/workflows/issue-1520-security-regressions.yml'
      - '.github/scripts/install_locked_python_test_dependencies.py'
      - 'scripts/quality/compact_test_runner.py'
      - 'tobkiri_runtime/core_runtime/**'
      - 'tobkiri_runtime/ecosystem/defaultspack/blocks/**'
      - 'tobkiri_runtime/ecosystem/defaultspack/domain/**'
      - 'tobkiri_runtime/ecosystem/rumi_*_pack/**'
      - 'tobkiri_runtime/tests/**'
      - 'tobkiri_runtime/requirements*.txt'

permissions:
  contents: read

concurrency:
  group: issue-1520-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  legacy-security:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install the existing hash-locked runtime test dependencies in CI
        run: python .github/scripts/install_locked_python_test_dependencies.py
      - name: Exercise real approval and executor boundaries
        run: >-
          python scripts/quality/compact_test_runner.py
          --log-dir "$RUNNER_TEMP"
          --log-file issue-1520-security.log --
          python -m pytest
          tobkiri_runtime/tests/test_egress_proxy.py
          tobkiri_runtime/tests/test_incremental_ai_stream.py
          tobkiri_runtime/tests/test_defaultspack_chat_filters_compact.py
          tobkiri_runtime/tests/test_defaultspack_desktop_access_exchange.py
          tobkiri_runtime/tests/test_defaultspack_self_improvement_runtime.py
          tobkiri_runtime/tests/test_defaultspack_tool_protocol_v2.py
          tobkiri_runtime/tests/test_defaultspack_coding_hardening.py
          tobkiri_runtime/tests/test_defaultspack_terminal_policy.py
          -q
      - name: Retain bounded test execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-1520-security-${{ matrix.os }}
          path: ${{ runner.temp }}/issue-1520-security.log
          if-no-files-found: warn
          retention-days: 14
