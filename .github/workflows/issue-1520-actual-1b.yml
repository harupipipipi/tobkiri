name: Issue 1520 actual Gemma 3 1B through Harness

on:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - '.github/workflows/issue-1520-actual-1b.yml'
      - 'crates/tobkiri-e2e/tests/llama.rs'
      - 'crates/tobkiri-e2e/tests/model_registry/**'
      - 'crates/tobkiri-e2e/tests/model_registry.rs'
      - 'crates/tobkiri-e2e/tests/provider_registry.rs'
      - 'crates/tobkiri-e2e/fixtures/saved-conversation-owner.json'
      - 'packs/local.model-registry-rust/**'
      - 'packs/local.saved-conversation-rust/**'
      - 'packs/local.openai-compat-provider/**'
      - 'packs/shapes/harness-chat-v2/**'
      - 'packs/local.provider-registry-rust/**'
      - 'packs/stage_registry_packs.py'
      - 'packs/local.harness-prompt/**'
      - 'packs/local.harness-conversation-store/**'
      - 'tools/quality/issue_1520_llama_cancel_probe.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actual-1b:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.cargo-actual-1b
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the supported native owner platform
        run: |
          test "$(uname -m)" = arm64
          test "$(uname -r)" = 24.6.0
          for root in "$RUNNER_TEMP" "$GITHUB_WORKSPACE/.."; do
            device="$(df -P "$root" | awk 'NR == 2 {print $1}')"
            diskutil info "$device" | grep -E 'Type \(Bundle\):[[:space:]]+apfs'
          done
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-wasip2
      - name: Build current verified Wasm Packs
        run: python3 -B packs/build.py --target-dir "$CARGO_TARGET_DIR"
      - name: Build the saved model and provider Registry components
        id: registered_model_build
        run: >-
          cargo build --locked --release --target wasm32-wasip2
          --manifest-path packs/Cargo.toml
          -p tobkiri-pack-model-registry-rust -p tobkiri-pack-provider-registry-rust
          -p tobkiri-pack-saved-conversation-rust -p tobkiri-pack-openai-compat-provider
          --features tobkiri-pack-model-registry-rust/component,tobkiri-pack-provider-registry-rust/component,tobkiri-pack-saved-conversation-rust/component
      - name: Author and verify the Registry Pack archives
        run: |
          cargo build --locked -p tobkiri-cli --bin tobkiri
          python3 -B packs/stage_registry_packs.py \
            --tobkiri "$CARGO_TARGET_DIR/debug/tobkiri" \
            --components "$CARGO_TARGET_DIR/wasm32-wasip2/release" \
            --output "$RUNNER_TEMP/registry-packs"
          echo "TOBKIRI_TEST_REGISTRY_PACKS=$RUNNER_TEMP/registry-packs" >> "$GITHUB_ENV"
      - name: Verify local provider preparation and approved save in the Wasm Registry
        shell: bash
        run: |
          python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/registered-provider.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-e2e --test provider_registry -- \
              provider_registry_uses_gated_private_storage_and_profile_revisions --ignored --exact --test-threads=1
      - name: Verify private Model resolution against original Registry records
        run: |
          python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/original-model-resolve.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-e2e --test model_registry -- \
              original_model_lookup_preserves_private_owner_result --ignored --exact --test-threads=1
      - name: Verify physical Provider Registry reads and settings redaction
        run: |
          python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/original-provider-snapshot.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-e2e --test provider_registry -- \
              original_provider_snapshot_reads_physical_owner_with_exact_projection --ignored --exact
      - name: Verify Model Access policy and catalog projections on the physical Registry
        run: |
          python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/original-provider-model-access.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-e2e --test provider_registry -- \
              original_provider_model_access_projects_physical_policy_and_catalog --ignored --exact
      - name: Fetch the pinned upstream server and model on the runner
        id: registered_model_assets
        shell: bash
        run: |
          umask 077
          work="$RUNNER_TEMP/tobkiri-1b"
          mkdir "$work"
          curl --fail --silent --show-error --location --retry 2 --max-time 300 \
            https://github.com/ggml-org/llama.cpp/releases/download/b11146/llama-b11146-bin-macos-arm64.tar.gz \
            -o "$work/server.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 300 \
            https://huggingface.co/ggml-org/gemma-3-1b-it-GGUF/resolve/f9c28bcd85737ffc5aef028638d3341d49869c27/gemma-3-1b-it-Q4_K_M.gguf \
            -o "$work/model.gguf"
          cd "$work"
          shasum -a 256 -c <<'SHA'
          1ad3f9eff80edb9dbef4259ad564d1720612ef7eea48fa4afed0e54f5f3d5711  server.tar.gz
          8ccc5cd1f1b3602548715ae25a66ed73fd5dc68a210412eea643eb20eb75a135  model.gguf
          SHA
          test "$(stat -f '%z' model.gguf)" = 806058240
          mkdir server
          tar -xzf server.tar.gz -C server
      - name: Run the authenticated loopback model through the actual Wasm Flow
        shell: bash
        run: |
          umask 077
          work="$RUNNER_TEMP/tobkiri-1b"
          keychain="$work/tobkiri-ci.keychain-db"
          previous_keychain="$(security default-keychain -d user | sed -E 's/^[[:space:]]*"([^"]+)"[[:space:]]*$/\1/')"
          test -n "$previous_keychain"
          server_pid=
          cleanup() {
            status=$?
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            security default-keychain -d user -s "$previous_keychain" || status=1
            if [[ -f "$keychain" ]]; then
              security delete-keychain "$keychain" || status=1
            fi
            rm -f "$work/api-key"
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings "$keychain"
          security default-keychain -d user -s "$keychain"
          unset keychain_password
          openssl rand -hex 32 > "$work/api-key"

          server="$work/server/llama-b11146/llama-server"
          test -x "$server"
          "$server" --model "$work/model.gguf" --offline --host 127.0.0.1 --port 18080 \
            --api-key-file "$work/api-key" --ctx-size 4096 --parallel 1 --threads 4 \
            --batch-size 512 --ubatch-size 128 --n-gpu-layers 0 --jinja --alias gemma3-1b-local \
            --no-webui --slots --log-verbosity 2 --log-colors off > "$work/server.log" 2>&1 &
          server_pid=$!
          ready=false
          for attempt in {1..90}; do
            kill -0 "$server_pid"
            if curl --fail --silent --max-time 2 http://127.0.0.1:18080/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          python3 -B - "$work/api-key" <<'PY'
          import json
          from pathlib import Path
          import sys
          from time import monotonic, sleep
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          token = Path(sys.argv[1]).read_text().strip()
          origin = "http://127.0.0.1:18080"
          try:
              with urlopen(origin + "/v1/models", timeout=5):
                  raise AssertionError("llama.cpp accepted an unauthenticated model request")
          except HTTPError as error:
              if error.code != 401:
                  raise

          def request(path):
              with urlopen(Request(origin + path, headers={
                  "Authorization": "Bearer " + token,
              }), timeout=5) as response:
                  return json.load(response)

          assert any(model["id"] == "gemma3-1b-local" for model in request("/v1/models")["data"])
          slots = request("/slots")
          assert isinstance(slots, list) and slots and all(not slot["is_processing"] for slot in slots)
          print("Pinned llama.cpp b11146: authenticated Gemma 3 1B alias and idle slot verified")

          # Time the same streaming API independently before the Harness test.
          # Use a different prompt and disable prompt caching for this request.
          payload = json.dumps({
              "model": "gemma3-1b-local",
              "messages": [{"role": "user", "content": "Name a color."}],
              "stream": True, "max_tokens": 8, "temperature": 0,
              "cache_prompt": False,
          }).encode()
          stream_request = Request(origin + "/v1/chat/completions", data=payload, headers={
              "Authorization": "Bearer " + token,
              "Content-Type": "application/json",
              "Accept": "text/event-stream",
          })
          start = monotonic()
          first = None
          done = False
          try:
              with urlopen(stream_request, timeout=40) as response:
                  assert response.headers.get_content_type() == "text/event-stream"
                  for line in response:
                      if monotonic() - start > 45:
                          raise TimeoutError
                      if not line.startswith(b"data:"):
                          continue
                      data = line.removeprefix(b"data:").strip()
                      if data == b"[DONE]":
                          done = True
                          break
                      for choice in json.loads(data).get("choices", []):
                          if first is None and choice.get("delta", {}).get("content"):
                              first = monotonic() - start
          except TimeoutError:
              print("Direct model stream: timed out")
          else:
              print(f"Direct model stream: first_text_seconds={first} "
                    f"total_seconds={monotonic() - start:.3f} done={done}")
          for _ in range(30):
              slots = request("/slots")
              if isinstance(slots, list) and slots and all(
                  not slot["is_processing"] for slot in slots
              ):
                  break
              sleep(1)
          else:
              raise AssertionError("direct diagnostic did not leave the model idle")
          PY
          test_status=0
          TOBKIRI_TEST_LLAMA=1 TOBKIRI_TEST_LLAMA_KEY_FILE="$work/api-key" \
            python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/actual-1b.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-e2e --test llama -- --ignored --exact --nocapture \
              real_1b_input_flow_wasm_stream_persist_and_cancel || test_status=$?
          if [[ "$test_status" -ne 0 ]]; then
            python3 -B - "$work/server.log" "$work/api-key" "$RUNNER_TEMP/authenticated-1b-server-tail.log" <<'PY' || echo "Authenticated server diagnostic unavailable" >&2
          from pathlib import Path
          import sys

          log, key_file, output = map(Path, sys.argv[1:])
          token = key_file.read_bytes().strip()
          with log.open("rb") as stream:
              size = stream.seek(0, 2)
              start = max(0, size - 32 * 1024)
              stream.seek(start)
              tail = stream.read(32 * 1024)
          if start:
              tail = tail.partition(b"\n")[2]
          tail = tail.rpartition(b"\n")[0]
          if token:
              tail = tail.replace(token, b"[redacted]")
          output.write_bytes(b"\n".join(tail.splitlines()[-80:]) + b"\n")
          PY
          fi
          python3 -B tools/quality/issue_1520_llama_cancel_probe.py \
            --origin http://127.0.0.1:18080 --key-file "$work/api-key" \
            > "$RUNNER_TEMP/direct-1b-cancel-probe.log" 2>&1 || true
          cat "$RUNNER_TEMP/direct-1b-cancel-probe.log"
          exit "$test_status"

      - name: Run the real 1B model selected by the saved Registries
        if: ${{ !cancelled() && steps.registered_model_assets.conclusion == 'success' && steps.registered_model_build.conclusion == 'success' }}
        shell: bash
        run: |
          umask 077
          work="$RUNNER_TEMP/tobkiri-1b"
          server="$work/server/llama-b11146/llama-server"
          "$server" --model "$work/model.gguf" --offline --host 127.0.0.1 --port 18081 \
            --ctx-size 4096 --parallel 1 --threads 4 --batch-size 512 --ubatch-size 128 \
            --n-gpu-layers 0 --jinja --alias gemma3-1b-local --no-webui \
            --log-verbosity 2 --log-colors off > "$work/registered-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          ready=false
          for attempt in {1..90}; do
            kill -0 "$server_pid"
            if curl --fail --silent --max-time 2 http://127.0.0.1:18081/health > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:18081/v1/models | \
            python3 -B -c 'import json,sys; assert [m["id"] for m in json.load(sys.stdin)["data"]] == ["gemma3-1b-local"]'
          export TOBKIRI_TEST_REGISTERED_LLAMA_ORIGIN=http://127.0.0.1:18081
          export TOBKIRI_TEST_REGISTERED_OPENAI_COMPONENT="$CARGO_TARGET_DIR/wasm32-wasip2/release/tobkiri_pack_openai_compat_provider.wasm"
          status=0
          python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/registered-1b.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-e2e --test model_registry -- --ignored --exact --nocapture \
              registered_network::real_1b_saved_model_streams_through_admitted_ui || status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 80 "$work/registered-server.log" >&2
            exit "$status"
          fi
      - name: Verify structured Wasm provider transport against a mock local API
        run: |
          cargo build --locked --release --target wasm32-wasip2 \
            --manifest-path packs/Cargo.toml -p tobkiri-pack-openai-compat-provider \
            --features structured-chat
          export TOBKIRI_TEST_REGISTERED_OPENAI_STRUCTURED_COMPONENT="$CARGO_TARGET_DIR/wasm32-wasip2/release/tobkiri_pack_openai_compat_provider.wasm"
          python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/registered-structured.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-e2e --test model_registry -- \
              registered_network::structured_provider_round_trips_two_model_requests --ignored --exact
      - name: Retain test receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: issue-1520-actual-1b
          path: |
            ${{ runner.temp }}/actual-1b.log
            ${{ runner.temp }}/actual-1b.receipt.json
            ${{ runner.temp }}/direct-1b-cancel-probe.log
            ${{ runner.temp }}/authenticated-1b-server-tail.log
            ${{ runner.temp }}/registered-1b.log
            ${{ runner.temp }}/registry-packs/
            ${{ runner.temp }}/registered-1b.receipt.json
            ${{ runner.temp }}/registered-structured.log
            ${{ runner.temp }}/registered-structured.receipt.json
            ${{ runner.temp }}/registered-provider.log
            ${{ runner.temp }}/registered-provider.receipt.json
            ${{ runner.temp }}/original-model-resolve.log
            ${{ runner.temp }}/original-model-resolve.receipt.json
          if-no-files-found: warn
