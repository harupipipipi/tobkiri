name: Issue 1520 Rust-connected actual App catalog Wasm
'on':
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - .github/workflows/issue-1520-bundle-catalog-kernel.yml
      - tools/python313-producer/build_schema_kernel.py
      - tools/python313-producer/build_schema_kernel_extension.py
      - tools/python313-producer/bundle_catalog_kernel_inputs.py
      - tools/python313-producer/bundle_catalog/kernel_runtime.py
      - tools/python313-producer/bundle_catalog/schema_progress.py
      - tools/python313-producer/bundle_catalog/schema_phases.py
      - tools/python313-producer/bundle_catalog/schema_phases.wit
      - tools/python313-producer/bundle_catalog_inputs.py
      - tools/python313-producer/build_components.py
      - tools/python313-producer/schema_kernel/**
      - tools/python313-producer/schema_kernel_translate.py
      - tools/python313-producer/tests/test_build_components.py
      - tools/python313-producer/tests/test_bundle_catalog_inputs.py
      - crates/tobkiri-wasm/tests/bundle_catalog_kernel_ci.rs
      - crates/tobkiri-wasm/tests/bundle_catalog_kernel_ci/**
  workflow_dispatch:
    inputs:
      app_schema_backend:
        description: Build the separate App-owned Rust frame checker instead of the generic candidate
        type: boolean
        required: false
        default: false
      schema_progress:
        description: Separate cumulative schema diagnostic; requires app_schema_backend
        type: boolean
        required: false
        default: false
      schema_phases:
        description: Observe cold schema phases and full-catalog read progress; requires app_schema_backend
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: issue-1520-bundle-kernel-${{ github.ref }}-${{ github.sha }}-${{ inputs.schema_phases && 'schema-phases' || inputs.schema_progress && 'schema-progress' || inputs.app_schema_backend && 'app-frame' || 'generic' }}
  cancel-in-progress: false
jobs:
  actual-app-wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      APP_SCHEMA_BACKEND: ${{ inputs.app_schema_backend && '1' || '0' }}
      APP_SCHEMA_PROGRESS: ${{ inputs.schema_progress && '1' || '0' }}
      APP_SCHEMA_PHASES: ${{ inputs.schema_phases && '1' || '0' }}
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: dtolnay/rust-toolchain@1.94.0
      - name: Fetch the original source for the frozen producer checkpoint
        run: git fetch --no-tags --depth=1 origin c6d7001249c661552416672448bda123c59b33ca
      - name: Check closed source adapters and new build scopes
        run: |
          if { [ "$APP_SCHEMA_PROGRESS" = 1 ] || [ "$APP_SCHEMA_PHASES" = 1 ]; } && [ "$APP_SCHEMA_BACKEND" != 1 ]; then
            echo 'schema diagnostics require app_schema_backend' >&2
            exit 1
          fi
          if [ "$APP_SCHEMA_PROGRESS" = 1 ] && [ "$APP_SCHEMA_PHASES" = 1 ]; then
            echo 'schema_progress and schema_phases are separate diagnostics' >&2
            exit 1
          fi
          python3 -B -m unittest discover -s tools/python313-producer/tests -p test_schema_loader.py
          python3 -B -m unittest discover -s tools/python313-producer/tests -p test_schema_compressed_loader.py
          python3 -B -m unittest discover -s tools/python313-producer/tests -p test_bundle_catalog_inputs.py
          python3 -B -m unittest discover -s tools/python313-producer/tests -p test_bundle_catalog_resources.py
          python3 -B tobkiri_runtime/scripts/generator_source_manifest.py --check
          python3 -B -m unittest discover -s tools/python313-producer/tests -p test_build_components.py
      - name: Restore the archived successful custom producer from its verified private archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/python313-producer/artifact_archive.py fetch
          --kind producer-cli --destination "$RUNNER_TEMP/harness-producer"
      - name: Restore the archived genuine rpds predecessor from its verified private archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -B tools/python313-producer/artifact_archive.py fetch
          --kind rpds --destination "$RUNNER_TEMP/schema-rpds"
      - name: Prepare pinned tools inside CI only
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap
          chmod 755 "$RUNNER_TEMP/harness-producer/work/target/release/componentize-py"
          python3 -B tools/python313-producer/fetch_validation_tools.py --destination "$RUNNER_TEMP/harness-validation"
          python3 -B tools/python313-producer/fetch_schema.py --destination "$RUNNER_TEMP/schema-inputs"
          python3 -B tools/python313-producer/fetch_schema_stdlib.py --destination "$RUNNER_TEMP/schema-stdlib"
      - name: Restore the exact pre-change original source with authenticated checkout
        uses: actions/checkout@v4
        with:
          ref: 54e7da008997a3eb45876cbe18459dba9902cc9d
          path: oracle-original
          persist-credentials: false
      - name: Compare against the actual pre-change original factory
        run: |
          python3 -B - "$RUNNER_TEMP" <<'PYTHON'
          import os, subprocess, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          packages = root / 'schema-inputs/packages'
          env = {**os.environ, 'PYTHONPATH': os.pathsep.join(str(p) for p in sorted(packages.iterdir()) if p.is_dir())}
          subprocess.run([sys.executable, '-B', 'tools/python313-producer/bundle_catalog_oracle.py',
                          '--source', str(Path(os.environ['GITHUB_WORKSPACE']) / 'oracle-original/tobkiri_runtime'),
                          '--output', str(root / 'bundle-cases.json'),
                          '--profile-output', str(root / 'bundle-native-profile.json')], env=env, check=True)
          subprocess.run([sys.executable, '-B', 'tools/python313-producer/schema_kernel_oracle.py',
                          '--source', str(Path(os.environ['GITHUB_WORKSPACE']) / 'oracle-original/tobkiri_runtime'),
                          '--output', str(root / 'schema-kernel-cases.json')], env=env, check=True)
          PYTHON
      - name: Restore checksum-bound cross compiler and SDK
        run: |
          set -euo pipefail
          python3 -B tools/python313-producer/fetch_toolchain.py --destination "$RUNNER_TEMP/app-schema-rust"
          python3 -B - <<'PYSDK'
          from pathlib import Path
          import os, sys
          sys.path.insert(0, 'tools/python313-producer')
          from fetch_sdk import acquire
          acquire(Path(os.environ['RUNNER_TEMP'])/'app-schema-sdk')
          PYSDK
      - name: Restore verified registry closure for the existing Rust kernel
        run: |
          set -euo pipefail
          export CARGO_HOME="$RUNNER_TEMP/app-schema-cargo-home"
          cargo fetch --locked --manifest-path tools/python313-producer/schema_kernel/Cargo.toml
          mkdir "$RUNNER_TEMP/app-schema-archives"
          python3 -B - <<'PYCRATES'
          from pathlib import Path
          import os, shutil, sys
          sys.path.insert(0, 'tools/python313-producer')
          from build_schema_kernel import restore_registry_vendor
          root=Path(os.environ['RUNNER_TEMP'])
          for path in (root/'app-schema-cargo-home/registry/cache').glob('*/*.crate'):
              target=root/'app-schema-archives'/path.name
              if target.exists():
                  raise ValueError('ambiguous registry archive name')
              shutil.copyfile(path,target)
          restore_registry_vendor(Path('tools/python313-producer/schema_kernel').resolve(),
                                  root/'app-schema-archives',root/'app-schema-vendor')
          PYCRATES
      - name: Compile only the source-built Wasm kernel in the offline namespace
        run: >-
          python3 -B tools/python313-producer/build_schema_kernel_extension.py
          ${{ inputs.app_schema_backend && '--app-backend' || '' }}
          ${{ inputs.schema_phases && '--schema-phases' || '' }}
          --source "$GITHUB_WORKSPACE/tools/python313-producer/schema_kernel"
          --vendor "$RUNNER_TEMP/app-schema-vendor"
          --archives "$RUNNER_TEMP/app-schema-archives"
          --rust "$RUNNER_TEMP/app-schema-rust"
          --sdk "$RUNNER_TEMP/app-schema-sdk"
          --destination "$RUNNER_TEMP/app-schema-extension"
      - name: Build the separate derived actual App catalog artifact
        run: >-
          python3 -B tools/python313-producer/build_components.py --bundle-catalog-kernel
          ${{ inputs.app_schema_backend && '--app-schema-backend' || '' }}
          ${{ inputs.schema_progress && '--app-schema-progress' || '' }}
          ${{ inputs.schema_phases && '--app-schema-phases' || '' }}
          --kernel-extension "$RUNNER_TEMP/app-schema-extension"
          --bundle-cases "$RUNNER_TEMP/bundle-cases.json"
          --producer "$RUNNER_TEMP/harness-producer"
          --validation "$RUNNER_TEMP/harness-validation"
          --destination "$RUNNER_TEMP/app-schema-bundle"
          --schema-inputs "$RUNNER_TEMP/schema-inputs"
          --stdlib "$RUNNER_TEMP/schema-stdlib"
          --rpds "$RUNNER_TEMP/schema-rpds"
      - name: Bind the actual derived source and component receipts
        id: bind_artifact
        run: |
          python3 -B - <<'PYBIND'
          from pathlib import Path
          import json, os, sys
          sys.path.insert(0, 'tools/python313-producer')
          from build_native import fingerprint
          from bundle_catalog_inputs import verify_component
          from bundle_catalog_kernel_inputs import PHASE_RECEIPT, component_name
          app_backend=os.environ['APP_SCHEMA_BACKEND']=='1'
          progress=os.environ['APP_SCHEMA_PROGRESS']=='1'
          phases=os.environ['APP_SCHEMA_PHASES']=='1'
          COMPONENT=component_name(app_backend=app_backend,schema_progress=progress,schema_phases=phases)
          root=Path(os.environ['RUNNER_TEMP'])
          report=json.loads((root/'app-schema-bundle/components-build.json').read_bytes())
          expected_format=(PHASE_RECEIPT if phases else 'tobkiri.app-schema-progress-native-diagnostic/1' if progress else 'tobkiri.app-frame-bundle-catalog-native-candidate/1' if app_backend else 'tobkiri.rust-bundle-catalog-native-candidate/1')
          if (report['format']!=expected_format
                  or report['outcome']!='success' or report['inputs_unchanged'] is not True
                  or report['production_enabled'] is not False
                  or set(report['components'])!={COMPONENT}):
              raise ValueError('actual separate App/Rust candidate required')
          if progress and (report.get('diagnostic_only') is not True
                  or report.get('split_schema_calls') is not True
                  or report.get('whole_catalog_acceptance') is not False):
              raise ValueError('separate diagnostic receipt required')
          if phases and (report.get('diagnostic_only') is not True
                  or report.get('split_schema_calls') is not False
                  or report.get('cold_schema_acceptance') is not False
                  or report.get('whole_catalog_acceptance') is not False):
              raise ValueError('separate one-shot phase diagnostic receipt required')
          item=report['components'][COMPONENT]
          component=root/'app-schema-bundle'/COMPONENT/'work/component.wasm'
          proof_path=component.with_name('component.build.json')
          if (fingerprint(component,32*1024*1024)!=item['artifact']
                  or fingerprint(proof_path)!=item['build_receipt']):
              raise ValueError('actual artifact/build receipt differs')
          verify_component(json.loads(proof_path.read_bytes()),item['source'],native=True,kernel_derived=True,app_schema_backend=app_backend,app_schema_progress=progress,app_schema_phases=phases)
          cases=root/'bundle-cases.json'
          source=item['source']['bundle_catalog']
          if source['original_bundle_cases']!=fingerprint(cases,4*1024*1024):
              raise ValueError('actual original DATA differs')
          if phases and source['original_resources']!=json.loads(cases.read_bytes())['schema_resources']:
              raise ValueError('actual diagnostic schema resources differ from the pinned original')
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              for label,path in [('COMPONENT',component),('CASES',cases)]:
                  stream.write(f'TOBKIRI_BUNDLE_{label}={path}\n')
                  stream.write(f'TOBKIRI_BUNDLE_{label}_SHA256={fingerprint(path)["sha256"]}\n')
              stream.write(f'TOBKIRI_BUNDLE_APP_BACKEND={int(app_backend)}\n')
              stream.write(f'TOBKIRI_BUNDLE_SCHEMA_PROGRESS={int(progress)}\n')
              stream.write(f'TOBKIRI_BUNDLE_SCHEMA_PHASES={int(phases)}\n')
              report_name=('app-schema-phases-observation.json' if phases else 'app-schema-progress-observation.json' if progress else 'app-schema-wasm-observation.json')
              stream.write(f'TOBKIRI_BUNDLE_REPORT={root/report_name}\n')
          PYBIND
      - uses: Swatinem/rust-cache@v2
        with:
          key: app-schema-catalog-kernel
          cache-on-failure: true
      - name: Isolate the independent original42 cold schema operation in the SAME artifact
        if: ${{ !cancelled() && !inputs.schema_progress && !inputs.schema_phases && steps.bind_artifact.conclusion == 'success' }}
        run: >-
          cargo test --locked -p tobkiri-wasm --test bundle_catalog_kernel_ci
          actual_app_frame_cold_schema_store_one_shot -- --ignored --exact --nocapture
      - name: Invoke the actual full App catalog once through the bounded native Store
        if: ${{ !cancelled() && !inputs.schema_progress && !inputs.schema_phases && steps.bind_artifact.conclusion == 'success' }}
        run: >-
          cargo test --locked -p tobkiri-wasm --test bundle_catalog_kernel_ci
          actual_rust_bundle_catalog_one_shot -- --ignored --exact --nocapture
      - name: Diagnose cumulative actual schema progress without renewing the Store budget
        if: ${{ !cancelled() && inputs.schema_progress && steps.bind_artifact.conclusion == 'success' }}
        run: |
          cargo test --locked -p tobkiri-wasm --test bundle_catalog_kernel_ci \
            schema_progress::actual_app_schema_cumulative_progress -- --ignored --exact --nocapture
          test -s "$RUNNER_TEMP/app-schema-progress-observation.json"
      - name: Observe phase fuel at host imports from one actual cold App schema-store call
        if: ${{ !cancelled() && inputs.schema_phases && steps.bind_artifact.conclusion == 'success' }}
        run: |
          python3 -B tools/quality/issue_1520_ci.py cargo-test \
            --log "$RUNNER_TEMP/app-schema-operation-sample-protocol.log" --expected-passed 1 -- \
            cargo test --locked -p tobkiri-wasm --features bootstrap-ci --test bundle_catalog_kernel_ci \
            schema_phases::fuel_samples::operation_samples_require_ordered_pairs_and_all_completed_counts -- --exact --nocapture
          cargo test --locked -p tobkiri-wasm --features bootstrap-ci --test bundle_catalog_kernel_ci \
            schema_phases::actual_app_schema_cold_store_phases -- --ignored --exact --nocapture
          test -s "$RUNNER_TEMP/app-schema-phases-observation.json"
      - name: Observe read checkpoints from one actual full App catalog call
        if: ${{ !cancelled() && inputs.schema_phases && steps.bind_artifact.conclusion == 'success' }}
        run: |
          cargo test --locked -p tobkiri-wasm --features bootstrap-ci --test bundle_catalog_kernel_ci \
            schema_phases::actual_app_full_catalog_reads -- --ignored --exact --nocapture
          test -s "$RUNNER_TEMP/app-full-catalog-reads-observation.json"
      - name: Retain actual source/build/runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.schema_phases && 'app-schema-phases-wasm-evidence' || inputs.schema_progress && 'app-schema-progress-wasm-evidence' || 'rust-app-catalog-wasm-evidence' }}
          path: |
            ${{ runner.temp }}/app-schema-extension/extension-build.json
            ${{ runner.temp }}/app-schema-extension/build.*
            ${{ runner.temp }}/app-schema-bundle/components-build.json
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-rust-kernel-native/inputs/plan.json
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-rust-kernel-native/inputs/provenance.json
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-rust-kernel-native/work/component.build.json
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-rust-kernel-native/build.*
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-app-frame-native/inputs/plan.json
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-app-frame-native/inputs/provenance.json
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-app-frame-native/work/component.build.json
            ${{ runner.temp }}/app-schema-bundle/harness-bundle-catalog-app-frame-native/build.*
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-progress-native/inputs/plan.json
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-progress-native/inputs/provenance.json
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-progress-native/work/component.build.json
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-progress-native/build.*
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-phases-native/inputs/plan.json
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-phases-native/inputs/provenance.json
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-phases-native/work/component.build.json
            ${{ runner.temp }}/app-schema-bundle/harness-app-schema-phases-native/build.*
            ${{ runner.temp }}/app-schema-wasm-observation.json
            ${{ runner.temp }}/app-schema-cold-store-observation.json
            ${{ runner.temp }}/app-schema-progress-observation.json
            ${{ runner.temp }}/app-schema-phases-observation.json
            ${{ runner.temp }}/app-full-catalog-reads-observation.json
            ${{ runner.temp }}/bundle-native-profile.json
          retention-days: 14
          if-no-files-found: warn
