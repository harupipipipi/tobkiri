name: Test

on:
  push:
    branches: [master, soon]
  pull_request:
    branches: [master, soon, codex/pack-architecture-program-soon]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  root-python-tests:
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run root pytest
        id: root_pytest
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/root-pytest-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-py${{ matrix.python-version }}.log"
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest tests/ -v 2>&1 | tee "$PYTEST_LOG"
          else
            pytest tests/test_entrypoint_contracts.py tests/test_windows_compat.py -v 2>&1 | tee "$PYTEST_LOG"
          fi

      - name: Upload root pytest log
        if: failure() && steps.root_pytest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: root-pytest-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/root-pytest-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python-version }}.log
          if-no-files-found: ignore

  tobkiri-contract-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Guard contract marker coverage
        working-directory: tobkiri_runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          missing = [
              str(path)
              for path in Path("tests").glob("test_*contract*.py")
              if "pytest.mark.contract" not in path.read_text(encoding="utf-8")
          ]
          if missing:
              raise SystemExit(
                  "Contract-named tests must opt into the contract marker: "
                  + ", ".join(missing)
              )
          PY

      # Keep the enforced cluster on current Host-owned boundaries. Historical
      # Pack fixture contracts remain independently runnable with
      # `pytest -m contract` while they migrate to the global owners.
      - name: Run active contract cluster pytest
        id: contract_pytest
        working-directory: tobkiri_runtime
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/contract-pytest-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.log"
          pytest -v \
            tests/test_company_contract_facade.py \
            tests/test_computer_host_contract.py \
            tests/test_entrypoint_contracts.py \
            tests/test_gateway_contract_client.py \
            tests/test_model_catalog_contract.py \
            tests/test_process_contract_runtime.py \
            tests/test_tobkiri_config_contracts.py \
            tests/test_defaultspack_template_contracts.py \
            tests/test_defaultspack_tool_manifest_contract.py \
            tests/test_defaultspack_tool_selection_settings_contract.py \
            2>&1 | tee "$PYTEST_LOG"

      - name: Upload contract pytest log
        if: failure() && steps.contract_pytest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: contract-pytest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/contract-pytest-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}.log
          if-no-files-found: ignore

  task-d-cross-platform-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Task D smoke tests
        working-directory: tobkiri_runtime
        run: |
          pytest tests/test_defaultspack_setup_pack.py tests/test_setup_pack_basepack.py tests/test_defaultspack_extension_registry.py tests/test_defaultspack_provider_foundation.py tests/test_defaultspack_provider_program.py tests/test_defaultspack_opencode_zen_provider.py tests/test_defaultspack_agent_run_store.py -v

  tobkiri-security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Audit Python dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run security/audit regression tests
        working-directory: tobkiri_runtime
        run: |
          pytest tests/test_approval_security.py tests/test_security_guards.py tests/test_defaultspack_integrity_scan.py tests/test_defaultspack_boundary_scan.py tests/test_defaultspack_shipped_bundle_hardening.py tests/test_capability_trust_store.py tests/test_defaultspack_tool_policy.py tests/test_defaultspack_capability_orchestrator.py tests/test_pack_signature.py -v

      - name: Run defaultspack boundary scan
        working-directory: tobkiri_runtime
        run: python scripts/quality/scan_defaultspack_boundaries.py

      - name: Validate defaultspack HTTP fallback metadata
        working-directory: tobkiri_runtime
        run: python scripts/quality/check_defaultspack_http_fallbacks.py

      - name: Guard command protocol and generated Pack SDK drift
        working-directory: tobkiri_runtime
        run: |
          python scripts/quality/scan_command_protocol.py \
            --inventory generated/pack_sdk/command_inventory.json \
            --check-inventory
          python scripts/tobkiri_pack.py generate generated/pack_sdk --check
          pytest -q \
            tests/test_defaultspack_command_protocol.py \
            tests/test_defaultspack_command_protocol_stream.py \
            tests/test_defaultspack_invocation_events.py \
            tests/test_defaultspack_offline_queue.py \
            tests/test_pack_sdk.py \
            tests/test_pack_signature.py

  pack-architecture:
    name: Pack architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository pack architecture boundary scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          reference="${RUNNER_TEMP}/pack-architecture-reference.json"
          if [ -z "${BASE_SHA}" ]; then
            echo "BASE_SHA is required for shrink-only baseline validation" >&2
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "Base commit is unavailable: ${BASE_SHA}" >&2
            exit 1
          fi
          if git cat-file -e "${BASE_SHA}:scripts/quality/pack_architecture_baseline.json" 2>/dev/null; then
            git show "${BASE_SHA}:scripts/quality/pack_architecture_baseline.json" > "${reference}"
            python scripts/quality/scan_pack_architecture.py --reference-baseline "${reference}"
          else
            echo "Bootstrapping pack architecture baseline; shrink-only comparison starts after merge"
            python scripts/quality/scan_pack_architecture.py
          fi

  conversation-steer:
    name: Conversation steer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run conversation steer regression tests
        working-directory: tobkiri_runtime
        run: |
          pytest \
            tests/test_defaultspack_conversation_controls.py \
            tests/test_defaultspack_conversation_steer_runtime_scope.py \
            tests/test_pack_architecture_wave7.py \
            -q

  frontend-security-audit:
    strategy:
      fail-fast: false
      matrix:
        app:
          - tobkiri_launcher/frontend
          - tobkiri_runtime/ecosystem/defaultspack/webapp
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: ${{ matrix.app }}
        run: npm run audit

      - name: Run defaultspack frontend tests
        if: matrix.app == 'tobkiri_runtime/ecosystem/defaultspack/webapp'
        working-directory: ${{ matrix.app }}
        run: npm test

      - name: Verify defaultspack host permission registry sync
        if: matrix.app == 'tobkiri_runtime/ecosystem/defaultspack/webapp'
        working-directory: ${{ matrix.app }}
        run: npm run check:host-permissions

      - name: Typecheck defaultspack frontend
        if: matrix.app == 'tobkiri_runtime/ecosystem/defaultspack/webapp'
        working-directory: ${{ matrix.app }}
        run: npm run lint

      - name: Build defaultspack frontend
        if: matrix.app == 'tobkiri_runtime/ecosystem/defaultspack/webapp'
        working-directory: ${{ matrix.app }}
        run: npm run build

      - name: Verify defaultspack vendored assets
        if: matrix.app == 'tobkiri_runtime/ecosystem/defaultspack/webapp'
        working-directory: ${{ matrix.app }}
        run: npm run check:vendored-assets -- --require-ui

      - name: Verify defaultspack frontend bundle is synchronized
        if: matrix.app == 'tobkiri_runtime/ecosystem/defaultspack/webapp'
        run: git diff --exit-code -- tobkiri_runtime/ecosystem/defaultspack/ui

  tobkiri-static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Ruff/mypy non-regression guard
        run: |
          BASE_REF="${GITHUB_BASE_REF:-master}"
          git fetch origin "$BASE_REF" --depth=1
          python .github/scripts/quality_gate_nonregression.py \
            --base-ref "origin/${BASE_REF}" \
            --package-dir tobkiri_runtime \
            --ruff-target core_runtime \
            --ruff-target backend_core \
            --ruff-target ecosystem/defaultspack/domain/coding \
            --ruff-target ecosystem/defaultspack/blocks/coding \
            --ruff-target app.py \
            --mypy-target core_runtime \
            --mypy-target backend_core \
            --mypy-target ecosystem/defaultspack/domain/coding \
            --mypy-target ecosystem/defaultspack/blocks/coding \
            --mypy-target app.py

  tobkiri-package-pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run package pytest
        id: package_pytest
        working-directory: tobkiri_runtime
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/package-pytest-${GITHUB_JOB}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-py${{ matrix.python-version }}.log"
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest tests/test_defaultspack_setup_pack.py tests/test_setup_pack_basepack.py tests/test_defaultspack_extension_registry.py tests/test_defaultspack_provider_foundation.py tests/test_defaultspack_provider_program.py tests/test_defaultspack_opencode_zen_provider.py tests/test_defaultspack_agent_run_store.py tests/test_agent_engine_tools.py tests/test_company_contract_facade.py -v 2>&1 | tee "$PYTEST_LOG"
          else
            pytest tests/test_defaultspack_setup_pack.py tests/test_setup_pack_basepack.py tests/test_defaultspack_extension_registry.py tests/test_defaultspack_provider_foundation.py tests/test_defaultspack_provider_program.py tests/test_defaultspack_opencode_zen_provider.py tests/test_defaultspack_agent_run_store.py -v 2>&1 | tee "$PYTEST_LOG"
          fi

      - name: Upload package pytest log
        if: failure() && steps.package_pytest.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: package-pytest-${{ matrix.python-version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-pytest-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}-py${{ matrix.python-version }}.log
          if-no-files-found: ignore

  desktop-contract-smoke:
    name: Desktop contracts (baseline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tobkiri_launcher/frontend/package-lock.json

      - name: Install viewer frontend dependencies
        working-directory: tobkiri_launcher/frontend
        run: npm ci

      - name: Run viewer launch contracts
        id: viewer_launch
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/viewer-launch-pytest.log"
          FRONTEND_LOG="${RUNNER_TEMP}/viewer-launch-frontend.log"
          (cd tobkiri_runtime && python -m pytest tests/test_defaultspack_desktop_launch_flow.py -v) 2>&1 | tee "$PYTEST_LOG"
          (cd tobkiri_launcher/frontend && node --import tsx --test src/lib/api.test.ts) 2>&1 | tee "$FRONTEND_LOG"

      - name: Run desktop/computer-use delegation contracts
        id: computer_delegation
        working-directory: tobkiri_runtime
        run: |
          set -o pipefail
          PYTEST_LOG="${RUNNER_TEMP}/computer-delegation-pytest.log"
          python -m pytest \
            tests/test_computer_desktop_action_delegation.py \
            tests/test_browser_computer_seat_delegation.py \
            -v 2>&1 | tee "$PYTEST_LOG"

      - name: Upload desktop contract failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-contract-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/viewer-launch-pytest.log
            ${{ runner.temp }}/viewer-launch-frontend.log
            ${{ runner.temp }}/computer-delegation-pytest.log
          if-no-files-found: warn

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pack-shell-test
          workspaces: pack-shell -> target

      - name: Run cargo test
        run: |
          for attempt in 1 2 3; do
            if (cd pack-shell && cargo test); then
              exit 0
            fi
            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            sleep $((attempt * 10))
          done

  tobkiri-launcher-macos:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tobkiri_launcher/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: tobkiri_launcher/frontend
        run: npm ci

      - name: Run frontend panel auth tests
        working-directory: tobkiri_launcher/frontend
        run: npm test

      - name: Build panel frontend
        working-directory: tobkiri_launcher/frontend
        run: npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tobkiri-launcher-macos
          workspaces: tobkiri_launcher/src-tauri -> target

      - name: Bundle uv binary for offline startup
        run: |
          set -euo pipefail

          UV_VERSION="0.11.14"
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64)
              UV_TRIPLE="aarch64-apple-darwin"
              ;;
            x86_64)
              UV_TRIPLE="x86_64-apple-darwin"
              ;;
            *)
              echo "Unsupported macOS architecture for uv bundle: ${ARCH}" >&2
              exit 1
              ;;
          esac

          UV_ASSET="uv-${UV_TRIPLE}.tar.gz"
          UV_URL="https://github.com/astral-sh/uv/releases/download/${UV_VERSION}/${UV_ASSET}"
          UV_ARCHIVE="$(mktemp -t uv-bundle.XXXXXX.tar.gz)"
          trap 'rm -f "$UV_ARCHIVE"' EXIT

          mkdir -p tobkiri_runtime/bundled
          echo "Downloading uv ${UV_VERSION} for ${UV_TRIPLE}: ${UV_URL}"
          if ! curl -fL --retry 5 --retry-delay 2 --connect-timeout 15 "$UV_URL" -o "$UV_ARCHIVE"; then
            echo "Failed to download uv archive. Check UV_VERSION/asset URL: ${UV_URL}" >&2
            exit 1
          fi

          file "$UV_ARCHIVE"
          if ! tar -tzf "$UV_ARCHIVE" "uv-${UV_TRIPLE}/uv" >/dev/null; then
            echo "Downloaded uv archive is invalid or missing uv-${UV_TRIPLE}/uv: ${UV_URL}" >&2
            exit 1
          fi

          tar -xzf "$UV_ARCHIVE" -C tobkiri_runtime/bundled --strip-components=1 "uv-${UV_TRIPLE}/uv"
          chmod +x tobkiri_runtime/bundled/uv
          echo "Bundled uv at:"
          ls -la tobkiri_runtime/bundled/

      - name: Build rumi viewer
        working-directory: tobkiri_launcher/src-tauri
        run: cargo build --locked

      - name: Run rumi viewer tests
        working-directory: tobkiri_launcher/src-tauri
        run: cargo test --locked

  mac-computer-driver-smoke:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run mac computer driver smoke tests
        working-directory: tobkiri_runtime
        run: |
          pytest tests/test_mac_cgevent_pid_driver.py tests/test_browser_cdp_driver.py tests/test_computer_fallback_order.py tests/test_computer_seat_service.py tests/test_computer_seat_default_factory.py -v

  mac-computer-use-visuals:
    if: >
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.draft == false &&
        contains(github.event.pull_request.labels.*.name, 'full-ci')
      )
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Compile and self-test EdgeHaze helper
        run: |
          swiftc tobkiri_runtime/ecosystem/rumi_default_tools_pack/domain/computer/mac/EdgeHaze.swift -o "${RUNNER_TEMP}/edge_haze"
          "${RUNNER_TEMP}/edge_haze" --self-test

      - name: Run mac computer-use visual/control tests
        working-directory: tobkiri_runtime
        run: |
          pytest tests/test_computer_use_haze.py tests/test_computer_desktop_action_delegation.py tests/test_computer_seat_service.py tests/test_browser_computer_seat_delegation.py -v

  windows-python-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            tobkiri_runtime/requirements.txt
            tobkiri_runtime/requirements-dev.txt

      - name: Install dependencies
        working-directory: tobkiri_runtime
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Windows portability smoke tests
        working-directory: tobkiri_runtime
        run: |
          pytest tests/test_windows_driver_skeleton.py tests/test_rumi_capability.py tests/test_defaultspack_tool_policy.py -v

  tobkiri-launcher-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tobkiri_launcher/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: tobkiri_launcher/frontend
        run: npm ci

      - name: Run frontend tests
