name: Issue 1520 original Setup candidate selection

'on':
  workflow_dispatch:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - tools/original_setup_candidate_selection_reference.py
      - tools/original_setup_review_reference.py
      - tools/original_catalog_prefix_reference.py
      - tools/original_active_profile_fixtures.py
      - tools/original_authority_reference.py
      - tools/original_publication_reference.py
      - .github/workflows/issue-1520-original-setup-candidate.yml

permissions:
  contents: read

concurrency:
  group: issue-1520-original-setup-candidate-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-setup-candidate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cf025f1eeab31a3daa2861b1f26a025c6954b6e
          path: original-setup-candidate-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install original-lock-pinned reference dependencies
        run: |
          python3 -B tools/original_setup_review_reference.py requirements \
            --original-root "$GITHUB_WORKSPACE/original-setup-candidate-source" \
            --output "$RUNNER_TEMP/original-setup-candidate-requirements.txt"
          python3 -m pip install --disable-pip-version-check --ignore-installed \
            --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/original-setup-candidate-requirements.txt"
      - name: Observe the original Setup candidate selection
        run: >-
          python3 -B tools/original_setup_candidate_selection_reference.py
          --original-root "$GITHUB_WORKSPACE/original-setup-candidate-source"
          --output "$RUNNER_TEMP/original-setup-candidate"
      - name: Retain bounded reference metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-setup-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/original-setup-candidate/summary.json
          if-no-files-found: warn
          retention-days: 7
