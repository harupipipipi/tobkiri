name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  UV_VERSION: "0.11.14"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          workspaces: |
            pack-shell -> target
            rumi_viewer/src-tauri -> target

      - name: Install Tauri CLI
        shell: bash
        run: |
          if ! command -v cargo-tauri >/dev/null 2>&1; then
            cargo install tauri-cli --version "^2" --locked
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            rumi_viewer/frontend/package-lock.json
            rumi_ai_1_10/ecosystem/defaultspack/webapp/package-lock.json

      - name: Install frontend dependencies
        working-directory: rumi_viewer/frontend
        run: npm ci

      - name: Install defaultspack frontend dependencies
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm ci

      - name: Run frontend release checks
        working-directory: rumi_viewer/frontend
        run: |
          npm test
          npm run lint
          npm run audit

      - name: Build panel frontend
        working-directory: rumi_viewer/frontend
        run: npm run build

      - name: Build defaultspack frontend
        working-directory: rumi_ai_1_10/ecosystem/defaultspack/webapp
        run: npm run build

      - name: Build pack-shell runtime
        working-directory: pack-shell
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Prepare bundled Rumi runtime
        run: python .github/scripts/prepare_tauri_resources.py --target ${{ matrix.target }} --uv-version ${{ env.UV_VERSION }} --require-runtime-tools

      - name: Run Rust release smoke tests
        working-directory: rumi_viewer/src-tauri
        run: cargo test --locked

      - name: Build with cargo tauri
        working-directory: rumi_viewer
        run: cargo tauri build --target ${{ matrix.target }} --ci

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            rumi_viewer/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          # Tags create a reviewable draft. A maintainer must publish it after
          # verifying the artifacts and release notes.
          draft: true
          generate_release_notes: true
