name: Issue 1520 original publication prelude reference

'on':
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - tools/original_publication_reference.py
      - .github/workflows/issue-1520-original-publication.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-1520-original-publication-${{ github.sha }}
  cancel-in-progress: false

jobs:
  original-prelude:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1cf025f1eeab31a3daa2861b1f26a025c6954b6e
          path: original-publication-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - name: Install only original-lock-pinned reference dependencies
        run: |
          python3 -B tools/original_setup_review_reference.py requirements \
            --original-root "$GITHUB_WORKSPACE/original-publication-source" \
            --output "$RUNNER_TEMP/original-publication-requirements.txt"
          python3 -m pip install --disable-pip-version-check --ignore-installed \
            --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/original-publication-requirements.txt"
      - name: Execute the real original recovery prelude against fresh fixtures
        run: >-
          python3 -B tools/original_publication_reference.py
          --original-root "$GITHUB_WORKSPACE/original-publication-source"
          --output "$RUNNER_TEMP/original-publication-reference"
      - name: Retain bounded observations only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-publication-reference-${{ matrix.os }}
          path: ${{ runner.temp }}/original-publication-reference/summary.json
          if-no-files-found: warn
