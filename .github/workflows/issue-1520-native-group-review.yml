name: Issue 1520 actual native grouped review
on:
  push:
    branches: [codex/issue-1520-native-shared-state]
    paths:
      - 'crates/tobkiri-gate/src/approval_review.rs'
      - 'crates/tobkiri-core/src/lib.rs'
      - 'crates/tobkiri-core/src/core.rs'
      - 'crates/tobkiri-core/src/native_profile_review_tests.rs'
      - 'tobkiri_launcher/core-host/src/native_contract.rs'
      - 'tobkiri_launcher/core-host/src/runtime.rs'
      - 'tobkiri_launcher/src-tauri/src/core_host.rs'
      - 'tobkiri_launcher/src-tauri/src/legacy.rs'
      - 'tobkiri_launcher/src-tauri/src/native_harness_bootstrap.rs'
      - 'tobkiri_launcher/src-tauri/src/native_setup_review*.rs'
      - 'tobkiri_launcher/src-tauri/tests/native_setup_review_webkit.rs'
      - 'tobkiri_launcher/src-tauri/build.rs'
      - 'tobkiri_launcher/src-tauri/setup_component_build.rs'
      - 'tobkiri_launcher/src-tauri/src/setup_component_path.rs'
      - 'tobkiri_launcher/src-tauri/Cargo.*'
      - 'tobkiri_launcher/frontend/src/lib/defaultsSetup*.ts'
      - 'tobkiri_launcher/frontend/src/lib/measureSetupReviewSlot*'
      - 'tobkiri_launcher/frontend/src/lib/nativeSetupConfirmation*'
      - 'tobkiri_launcher/frontend/src/pages/Defaults*Review*.tsx'
      - 'tobkiri_launcher/frontend/src/pages/DefaultsConfirmationDetails.tsx'
      - 'tobkiri_launcher/frontend/src/pages/NativeSetupReview.tsx'
      - 'tobkiri_launcher/frontend/src/pages/Setup.test.tsx'
      - 'tobkiri_launcher/frontend/src/pages/Setup.tsx'
      - 'tobkiri_launcher/frontend/src/setup-review.*'
      - 'tobkiri_launcher/frontend/setup-review/**'
      - 'tobkiri_launcher/frontend/scripts/package-setup-review.mjs'
      - 'tobkiri_launcher/frontend/package.json'
      - 'tobkiri_launcher/frontend/vite.setup-review.config.ts'
      - '.github/workflows/issue-1520-native-group-review.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue-1520-native-group-review-${{ github.sha }}
  cancel-in-progress: false
env:
  CARGO_BUILD_JOBS: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
jobs:
  portable-contract:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test --locked -p tobkiri-launcher-core-host --lib
      - run: cargo test --locked -p tobkiri-gate
      - run: cargo test --locked -p tobkiri-core --lib native_profile_review_tests
  actual-macos-host:
    runs-on: macos-15
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tobkiri_launcher/src-tauri -> target
          cache-on-failure: true
      - name: Build the actual Core host frontend used by Tauri context
        working-directory: tobkiri_launcher/frontend
        run: |
          npm ci
          npm run build:core-host
      - name: Verify shared Setup presentation and legacy transport compatibility
        working-directory: tobkiri_launcher/frontend
        run: >-
          node --import tsx --test
          src/lib/defaultsSetup.test.ts src/lib/measureSetupReviewSlot.test.mjs
          src/lib/nativeSetupConfirmation.test.mjs src/pages/Setup.test.tsx
          src/pages/DefaultsReview.successor.test.tsx
          src/pages/DefaultsReview.packVersions.test.tsx
      - name: Build the isolated Setup review assets
        working-directory: tobkiri_launcher/frontend
        run: npm run build:setup-review
      - run: cargo check --locked --manifest-path tobkiri_launcher/src-tauri/Cargo.toml --features core-host
      - name: Exercise the isolated view in actual AppKit and WebKit
        run: >-
          cargo test --locked --manifest-path tobkiri_launcher/src-tauri/Cargo.toml
          --features core-host,native-setup-review --test native_setup_review_webkit
      - name: Verify Setup component staging and fixed digest
        run: >-
          cargo test --locked --manifest-path tobkiri_launcher/src-tauri/Cargo.toml
          --features core-host --test build_script
          build_script::setup_component_build::tests::verified_bytes_and_index_are_staged_together -- --exact
      - name: Build and seal the original debug Pack Shell
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tobkiri_launcher/src-tauri/target
        run: |
          cargo build --locked --manifest-path pack-shell/Cargo.toml --target aarch64-apple-darwin
          python3 -B .github/scripts/seal_pack_shell.py --target aarch64-apple-darwin
      - name: Compile the review owner and worker in the original Launcher
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/tobkiri_launcher/src-tauri/target
        run: >-
          cargo check --locked --manifest-path tobkiri_launcher/src-tauri/Cargo.toml
          --features native-harness-bootstrap,native-setup-review
