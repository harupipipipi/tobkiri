[package]
name = "tobkiri-launcher"
version = "1.0.0-beta.3"
edition = "2021"

[features]
default = []
core-host = ["dep:tobkiri-launcher-core-host", "dep:async-trait", "dep:tokio", "dep:ulid"]
native-source-inspection = ["dep:tobkiri-core", "dep:tokio", "dep:async-trait"]
native-harness-bootstrap = ["dep:tobkiri-core", "dep:tobkiri-gate", "dep:tobkiri-harness-native", "dep:tobkiri-wasm", "dep:tokio"]

[lib]
name = "tobkiri_launcher_lib"
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
base64 = "0.22"
ed25519-dalek = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"

[target.'cfg(windows)'.build-dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemServices"] }

[target.'cfg(unix)'.build-dependencies]
libc = "0.2"

[dependencies]
tobkiri-launcher-core-host = { path = "../core-host", optional = true }
tobkiri-core = { path = "../../crates/tobkiri-core", optional = true }
tobkiri-gate = { path = "../../crates/tobkiri-gate", optional = true }
tobkiri-harness-native = { path = "../harness-native", optional = true }
tobkiri-wasm = { path = "../../crates/tobkiri-wasm", optional = true }
async-trait = { version = "=0.1.92", optional = true }
tokio = { version = "=1.53.3", features = ["sync", "time"], optional = true }
ulid = { version = "=1.2.1", optional = true }
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2.7.2"
raw-window-handle = "0.6.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
semver = "1"
open = "5"
rand = "0.8"
which = "7"
dirs = "6"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
ed25519-dalek = "2"
shell-words = "1"

[dev-dependencies]
wat = "=1.252.0"

# Development startup authenticates large VM images too. Optimize the digest
# implementation rather than omitting any seal/inventory verification pass.
# Release packaging retains its existing profile below.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2.4.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
dispatch2 = "0.3"
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[patch.crates-io]
wasmtime = { path = "../../vendor/wasmtime" }
wasmtime-internal-fiber = { path = "../../vendor/wasmtime-internal-fiber" }
