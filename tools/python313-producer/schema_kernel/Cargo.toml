[package]
name = "tobkiri-schema-kernel"
version = "0.1.0"
edition = "2021"
publish = false

# This comparison experiment does not join the product workspace.
[workspace]

[lib]
name = "_tobkiri_schema_kernel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", default-features = false, features = ["macros", "abi3-py313"] }

[package.metadata.tobkiri]
schema-engine = "original-object-port-primitives"
